;;;; -*- mode:lisp -*-
;;;;
;;;; ASDF source-registry fragment for clautolisp, installed by
;;;; `make install-libraries' as
;;;;
;;;;     <PREFIX>/etc/common-lisp/source-registry.conf.d/50-clautolisp.conf
;;;;
;;;; It registers <PREFIX>/share/common-lisp/source/, where the same
;;;; phase installs the clautolisp systems, so that
;;;;
;;;;     (asdf:load-system "clautolisp")
;;;;
;;;; works with no per-user configuration. The path is written
;;;; relative to this file (`:here' is the directory containing it),
;;;; so the installed tree stays relocatable: ../../../ climbs
;;;; source-registry.conf.d -> common-lisp -> etc -> <PREFIX>.
;;;;
;;;; ASDF reads this file only when <PREFIX>/etc is one of the
;;;; XDG_CONFIG_DIRS. It already is for /etc; for any other prefix,
;;;; e.g. the /opt/local default:
;;;;
;;;;     export XDG_CONFIG_DIRS=/opt/local/etc:${XDG_CONFIG_DIRS:-/etc/xdg}
;;;;
;;;; And it is read only if no higher-priority configuration cuts the
;;;; inheritance chain: a ~/.config/common-lisp/source-registry.conf
;;;; saying :ignore-inherited-configuration (or a CL_SOURCE_REGISTRY
;;;; ending the same way) discards every system-level fragment,
;;;; including this one.

(:tree (:here "../../../share/common-lisp/source/"))
