name: CI

# GitHub mirror of the COMMON (Linux, host-portable) lanes of
# .gitlab-ci.yml. GitLab is the source of truth; this file reproduces only
# the jobs that run on an ordinary ubuntu-latest runner — the SBCL + CCL
# FiveAM suites, the alfe conformance/spec-coverage gates, file-compat, and
# the alfe binary smoke build. The GitLab-only lanes (native macOS/Windows
# on self-hosted runners, vendor BricsCAD/AutoCAD probes, benchmarks,
# encoding/pathname experiments, the release matrix) are NOT mirrored here —
# they need self-hosted or CAD-equipped runners GitHub does not provide.
#
# PARITY RULE: before merging to master or cutting a release tag/branch,
# re-sync this file with the common lanes of .gitlab-ci.yml. See
# .github/workflows/README.md for the job-by-job mapping and the rule.

# POLICY: non-regression / validation runs on GitLab (Linux-on-poseidon baseline
# + best-effort native), NOT on GitHub — no point burning our monthly GitHub
# minutes on push/MR tests. This mirror is MANUAL-ONLY: dispatch it by hand when
# you want a second opinion on a clean ubuntu-latest. GitHub's release-path role
# is the Windows builder (release.yml), nothing else.
on:
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new push lands. Tag builds
# get their own group so a master push doesn't cancel a tag build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # --------------------------------------------------------------------- #
  # SBCL — every FiveAM suite, the alfe conformance corpus + spec-coverage
  # gate, and the file-compat report. One job so the SBCL+Quicklisp install
  # is paid once. Mirrors GitLab test:clautolisp:sbcl,
  # test:clautolisp:file-compat:sbcl, test:autolisp-test:sbcl,
  # test:alfe:sbcl, test:alfe:conformance, test:alfe:spec-coverage.
  sbcl-test:
    name: SBCL — full test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lisp

      - name: clautolisp — FiveAM suite (SBCL)
        run: make -C clautolisp test-sbcl

      # The compiler gates: the whole corpus with every function body
      # compiled, then with every instrumented body compiled (both assert
      # that compiled and interpreted evaluation AGREE), then the question
      # neither asks -- does the program that SHIPS have a compiler in it?
      - name: clautolisp — compiler gates + shipped-compiler smoke (SBCL)
        run: |
          make -C clautolisp test-compiler-equivalence
          make -C clautolisp test-debug-compiled
          make -C clautolisp test-shipped-compiler

      - name: clautolisp — file-compat report (SBCL)
        run: |
          mkdir -p clautolisp/.artifacts
          make -C clautolisp run-file-compat-sbcl \
            FILE_COMPAT_ARGS="--tag builtin --report-format json --output .artifacts/file-compat-sbcl.json"

      - name: autolisp-test — conformance harness
        run: make -C autolisp-test test

      - name: autolisp-front-end (alfe) — FiveAM suite (SBCL)
        run: make -C autolisp-front-end test-sbcl

      - name: autolisp-front-end (alfe) — scenario conformance
        run: make -C autolisp-front-end conformance

      - name: autolisp-front-end (alfe) — spec-coverage gate
        run: make -C autolisp-front-end check-spec-coverage

  # --------------------------------------------------------------------- #
  # CCL — the Clozure CL lanes. CCL is a supported host; this lane went
  # green with clautolisp 1.7.11 (ccl-suite-failures.issue) and closes
  # ci-github-ccl-lane.issue. Mirrors GitLab test:clautolisp:ccl,
  # test:clautolisp:file-compat:ccl, test:alfe:ccl.
  ccl-test:
    name: CCL — clautolisp + alfe suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lisp
        with:
          ccl: "true"

      - name: clautolisp — FiveAM suite (CCL)
        run: make -C clautolisp test-ccl

      # A .lap is a native host FASL, so each host ships its own compiler
      # and each has to be asked separately (the 2.0.11 lesson).
      - name: clautolisp — shipped-compiler smoke (CCL)
        run: make -C clautolisp test-shipped-compiler-ccl

      - name: clautolisp — file-compat report (CCL)
        run: |
          mkdir -p clautolisp/.artifacts
          make -C clautolisp run-file-compat-ccl \
            FILE_COMPAT_ARGS="--tag builtin --report-format json --output .artifacts/file-compat-ccl.json"

      - name: autolisp-front-end (alfe) — FiveAM suite (CCL)
        run: make -C autolisp-front-end test-ccl

  # --------------------------------------------------------------------- #
  # Smoke build: produce alfe-sbcl, verify --version matches the source, run
  # the headline acceptance, upload the binary. Mirrors GitLab build:alfe:sbcl.
  alfe-binary:
    name: alfe — SBCL binary build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lisp

      - name: Build alfe-sbcl
        run: make -C autolisp-front-end build-alfe-sbcl

      - name: Verify alfe --version
        # Cross-check the built binary reports the version the source
        # declares — catches a version bump with a forgotten rebuild.
        run: |
          declared=$(sed -n 's/.*\*version\* "\([^"]*\)".*/\1/p' \
                       autolisp-front-end/tools/alfe/source/version.lisp)
          actual=$(./autolisp-front-end/tools/alfe/bin/alfe-sbcl --version)
          echo "declared: $declared"
          echo "actual:   $actual"
          [ "$actual" = "alfe $declared" ] || {
            echo "Version mismatch: built binary says '$actual', source says 'alfe $declared'." >&2
            exit 1
          }

      - name: Smoke-test alfe --clautolisp -x '(princ (+ 1 2))'
        # The headline V1 acceptance criterion. alfe -x does NOT auto-print
        # its value (doc-x-output-semantics.issue) — wrap in (princ ...);
        # --no-init keeps init-file output out of captured stdout.
        run: |
          output=$(./autolisp-front-end/tools/alfe/bin/alfe-sbcl \
                     --no-init --clautolisp -x '(princ (+ 1 2))')
          echo "output: $output"
          [ "$output" = "3" ] || {
            echo "Headline acceptance failed: got '$output' (expected '3')." >&2
            exit 1
          }

      - name: Upload alfe-sbcl artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfe-sbcl-linux-x64
          path: autolisp-front-end/tools/alfe/bin/alfe-sbcl
          if-no-files-found: error
          retention-days: 14
