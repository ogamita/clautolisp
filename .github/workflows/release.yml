name: Release (Windows package)

# GitHub is the ALWAYS-AVAILABLE Windows release builder, and ONLY that
# (release-pipeline.md §3/§5). The only Windows deps are SBCL + compiling
# libredwg, so a GitHub-hosted windows-latest runner produces the native
# Windows package (documentation/windows-package-spec.md) and uploads it as the
# `clautolisp-<ver>-win-<arch>` workflow artifact. poseidon's GitLab
# `collect:release` job pulls it with `gh run download` and folds it into the
# combined release set. GitHub does NOT publish a Release here — sources,
# documentation, the linux/macOS binaries+libraries, assembly and publishing
# all happen on poseidon/GitLab.
#
# Non-Windows platforms and the non-regression test pipelines stay on GitLab
# (never burn GitHub minutes for those). This workflow builds ONLY Windows.

on:
  push:
    tags: ['release-[0-9]*']
  workflow_dispatch:

permissions:
  contents: read          # builder-only: no Release is created from GitHub

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 is the shipped Windows target. (windows-11-arm can be added as
          # an experimental row once the toolchain is proven.)
          - { arch: x64, runner: windows-latest, experimental: false }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Read version
        id: ver
        shell: bash
        run: |
          v="$(sed -n 's/.*\*version\* *"\([0-9.]*\)".*/\1/p' \
               clautolisp/tools/clautolisp/source/version.lisp)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "clautolisp version: $v"

      - name: Install toolchain (SBCL, make, zip)
        shell: pwsh
        run: |
          # cmake + the MSVC C toolchain are preinstalled on the windows-latest
          # image; add SBCL and the Unix-ish packaging tools the Makefile needs.
          choco install -y --no-progress sbcl make zip

      - name: Bootstrap Quicklisp
        shell: bash
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$RUNNER_TEMP/ql.lisp"
          sbcl --non-interactive --load "$RUNNER_TEMP/ql.lisp" \
               --eval '(quicklisp-quickstart:install)'

      - name: Build libdwg.dll + programs, stage libraries
        shell: bash
        run: |
          set -euo pipefail
          make build-libraries      # vendored libredwg -> libdwg.dll (+ CFFI shim)
          make build-programs       # SBCL .exe images
          make stage-libraries      # ASDF systems + native libs into the stage tree

      - name: Package native-Windows zip
        shell: bash
        run: make release-windows-zip WIN_ARCH=${{ matrix.arch }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          # Name MUST match the `gh run download -p 'clautolisp-*-win-*'` glob
          # the GitLab collect:release job uses.
          name: clautolisp-${{ steps.ver.outputs.version }}-win-${{ matrix.arch }}
          path: dist/clautolisp-*-win-*.zip
          if-no-files-found: error
