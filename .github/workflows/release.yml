name: Release (Windows builder)

# GitHub is the ALWAYS-AVAILABLE, CAD-free Windows build host for releases
# (issues/open/windows-build-host.issue / !129). It runs master's own
# scripts/release-windows.sh on a GitHub windows-latest MSYS2 runner — the
# SAME Makefile packaging every other platform uses — and uploads the per-target
# Windows zips as workflow artifacts. GitLab's collect:release pulls them with
# `gh run download` and unions them into the release set.
#
# BUILDER-ONLY, no publish: GitLab remains the sole release publisher
# (scripts/make-gitlab-release.py). GitHub attaching a divergent set to a
# same-named release is exactly what master's design forbids, so nothing is
# published here.
#
# The self-hosted Windows PC keeps a 100%-manual release:windows:x86-64 fallback
# on GitLab (and all the CAD lanes); this workflow is the primary Windows path.
#
# SBCL SOURCE is selectable, so the two approaches trialled in parallel coexist:
#   - `mingw' (DEFAULT): mingw-w64-x86_64-sbcl via pacman — proven green.
#   - `choco':          the official SBCL MSI via Chocolatey (+ SBCL_HOME shim).
# Choose per-run with the workflow_dispatch input, or repo-wide with the
# `SBCL_SOURCE' repository variable (Settings > Secrets and variables > Actions
# > Variables). Precedence: dispatch input > repo variable > `mingw'.

on:
  push:
    tags: ['release-[0-9]*']
  workflow_dispatch:
    inputs:
      sbcl_source:
        description: 'SBCL source'
        type: choice
        options: [mingw, choco]
        default: mingw

permissions:
  contents: read           # builder-only: no Release is created from GitHub

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: windows-latest, msystem: MINGW64, prefix: mingw-w64-x86_64, experimental: false }
    env:
      # Precedence: dispatch input > repo variable SBCL_SOURCE > mingw.
      SBCL_SOURCE: ${{ github.event.inputs.sbcl_source || vars.SBCL_SOURCE || 'mingw' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          update: true
          # Toolchain only — SBCL is installed by the selectable step below.
          install: >-
            git make zip unzip m4 curl diffutils
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-pkgconf

      - name: Install SBCL (mingw — pacman)
        if: env.SBCL_SOURCE != 'choco'
        run: |
          pacman -S --noconfirm --needed ${{ matrix.prefix }}-sbcl
          sbcl --version

      - name: Install SBCL (choco — official MSI)
        if: env.SBCL_SOURCE == 'choco'
        shell: pwsh
        run: |
          choco install sbcl --no-progress -y
          $home_ = "C:\Program Files\Steel Bank Common Lisp"
          if (-not (Test-Path "$home_\sbcl.exe")) {
            Get-ChildItem "C:\Program Files" -Filter "*Bank*" | Out-String | Write-Host
            throw "sbcl.exe is not where the package says it is: $home_"
          }
          # SBCL_HOME is set as a MACHINE var during the run, which the runner
          # process (started earlier) never sees; publish it (Windows form —
          # sbcl.exe is native and cannot read /c/...), and keep MSYS2 from
          # rewriting it at the boundary, like environnement-windows.sh does CC.
          Add-Content -Path $env:GITHUB_ENV -Value "SBCL_HOME=$home_"
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_ENV_CONV_EXCL=SBCL_HOME;CC"

      - name: Read version
        id: ver
        run: |
          v="$(sed -n 's/.*\*version\* *"\([0-9.]*\)".*/\1/p' \
               clautolisp/tools/clautolisp/source/version.lisp)"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "version: $v (SBCL_SOURCE=$SBCL_SOURCE)"

      - name: Bootstrap Quicklisp
        run: |
          # Source environnement-windows.sh so choco's SBCL dir lands on PATH
          # (mingw's /mingw64/bin is already there); harmless for the mingw case.
          . scripts/environnement-windows.sh
          command -v sbcl >/dev/null 2>&1 || { echo "sbcl not on PATH"; exit 1; }
          sbcl --version
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$HOME/ql.lisp"
          sbcl --non-interactive --load "$HOME/ql.lisp" \
               --eval '(quicklisp-quickstart:install)'

      # Master's own Windows release script: sources environnement-windows.sh
      # (picks CC=/mingw64/bin/gcc under MINGW64; its self-hosted-only PATH
      # entries are [ -d ]-guarded, so they no-op here) then runs the ordinary
      # Makefile packaging (build-libraries, build-programs, release-programs,
      # release-libraries, verify-release-artefacts).
      - name: Build the Windows release artefacts
        run: sh scripts/release-windows.sh

      - name: List artefacts
        run: ls -l dist

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          # Name matches the `gh run download -p 'clautolisp-*-windows-*'` glob
          # the GitLab collect:release job uses.
          name: clautolisp-${{ steps.ver.outputs.version }}-windows-${{ matrix.arch }}
          path: dist/clautolisp-*-windows-*.zip
          if-no-files-found: error
