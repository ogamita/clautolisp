name: Release (Windows package)

# GitHub is the ALWAYS-AVAILABLE Windows release builder, and ONLY that
# (release-pipeline.md §3/§5). The only Windows deps are SBCL + compiling
# libredwg, so a GitHub-hosted windows-latest runner produces the native
# Windows package (documentation/windows-package-spec.md) and uploads it as the
# `clautolisp-<ver>-win-<arch>` workflow artifact. poseidon's GitLab
# `collect:release` job pulls it with `gh run download` and folds it into the
# combined release set. GitHub does NOT publish a Release here.
#
# Toolchain: a single MSYS2 / MINGW64 environment provides gcc + cmake + make +
# zip + SBCL, so the Unix-shaped Makefile and the libredwg C build run exactly
# as they do on Linux — far more reliable than choco+MSVC for libdwg. (pjb has
# the same msys2 dependency set pre-archived for the self-hosted Windows runner
# at pfenny:c:\staging\run-forest-run\artefacts.)
#
# Non-Windows platforms and the non-regression test pipelines stay on GitLab
# (never burn GitHub minutes for those). This workflow builds ONLY Windows.

on:
  push:
    tags: ['release-[0-9]*']
  workflow_dispatch:

permissions:
  contents: read          # builder-only: no Release is created from GitHub

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 is the shipped Windows target. (An arm64 row can be added once
          # the MINGW-ARM64 toolchain + a windows-11-arm runner are proven.)
          - { arch: x64, runner: windows-latest, msystem: MINGW64, prefix: mingw-w64-x86_64, experimental: false }
    defaults:
      run:
        shell: msys2 {0}      # every `run:` below executes in the MSYS2 shell
    steps:
      # checkout runs in the default runner shell (it's a `uses:` step).
      - name: Checkout
        uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false        # use the base install; just add packages
          update: true
          install: >-
            git make zip m4 curl
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-sbcl

      - name: Read version
        id: ver
        run: |
          v="$(sed -n 's/.*\*version\* *"\([0-9.]*\)".*/\1/p' \
               clautolisp/tools/clautolisp/source/version.lisp)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "clautolisp version: $v"
          sbcl --version
          gcc --version | head -1
          cmake --version | head -1

      - name: Bootstrap Quicklisp
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$HOME/ql.lisp"
          sbcl --non-interactive --load "$HOME/ql.lisp" \
               --eval '(quicklisp-quickstart:install)'

      - name: Build libdwg.dll + programs, stage libraries
        run: |
          set -euo pipefail
          make build-libraries      # vendored libredwg -> libdwg.dll (+ CFFI shim)
          make build-programs       # SBCL .exe images
          make stage-libraries      # ASDF systems + native libs into the stage tree

      - name: Package native-Windows zip
        run: make release-windows-zip WIN_ARCH=${{ matrix.arch }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          # Name MUST match the `gh run download -p 'clautolisp-*-win-*'` glob
          # the GitLab collect:release job uses.
          name: clautolisp-${{ steps.ver.outputs.version }}-win-${{ matrix.arch }}
          path: dist/clautolisp-*-win-*.zip
          if-no-files-found: error
