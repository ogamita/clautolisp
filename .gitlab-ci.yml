# ======================================================================
# GitHub Actions parity (see .github/workflows/README.md)
# ----------------------------------------------------------------------
# This file is the SOURCE OF TRUTH for CI. The COMMON (Linux, host-portable)
# lanes below are ALSO mirrored, by hand, into .github/workflows/ci.yml,
# because GitLab->GitHub is a plain git mirror that does NOT translate CI.
#
# COMMON — keep .github/workflows/ci.yml in sync with these before a merge
# to master or a release tag/branch:
#   test:clautolisp:sbcl        test:clautolisp:ccl
#   test:clautolisp:file-compat:sbcl   test:clautolisp:file-compat:ccl
#   test:autolisp-test:sbcl
#   test:alfe:sbcl   test:alfe:ccl   test:alfe:conformance
#   test:alfe:spec-coverage      build:alfe:sbcl
#
# GITLAB-ONLY (NOT mirrored — need self-hosted / CAD-equipped runners):
#   the CI-image build; every *:macos / *:windows job; verify:*; vendor:*;
#   *:probe:*; encoding:experiment:*; benchmark:*; the release:* matrix;
#   pages / collect / deploy.
# ======================================================================

variables:
  CLAUTOLISP_CI_IMAGE: $CI_REGISTRY_IMAGE/clautolisp-ci
  CLAUTOLISP_CI_LATEST: $CI_REGISTRY_IMAGE/clautolisp-ci:latest
  # Foreign-arch base images, pinned to their per-arch MANIFEST DIGEST.
  # GitLab Runner 19.1's docker executor ignores `[runners.docker] platform`,
  # so a plain `buildpack-deps:bookworm` would be pulled as amd64. Pinning the
  # arm sub-manifest digest makes the daemon pull that exact (single-platform)
  # image, which then runs under host binfmt/qemu-user-static. Refresh with:
  #   docker manifest inspect buildpack-deps:bookworm \
  #     | jq -r '.manifests[]|select(.platform.architecture=="arm64" or
  #              (.platform.architecture=="arm" and .platform.variant=="v7"))
  #              |"\(.platform.architecture)\(.platform.variant//"") \(.digest)"'
  ARM64_BASE: "buildpack-deps@sha256:22e6f90b138866051d4209b774fe28813483a8b67b431b4cb6475176ebe06a86"
  ARMV7_BASE: "buildpack-deps@sha256:b7e46ca6d5b66b2e56275cd8b319bfc87355efad36b4b089601c771674b79b4e"

default:
  image: $CLAUTOLISP_CI_LATEST
  # Runners are selected by CONFIGURATION tags: <os>,<arch>,<executor>
  # (+ capability tags like gui/cad where a job needs them; `cad' is ONE tag
  # for every vendor, on a concurrency=1 runner, because the mutex is global
  # — see the CAD-capability note in .gitlab/native.yml).
  # The linux/amd64 work runs in the CI image on the self-hosted poseidon
  # group runner (ogamita-linux-docker, tags linux,amd64,docker; poseidon
  # is the always-on Linux compute box). Jobs needing another platform
  # override `tags:` — arm64/macOS → thalassa, windows → the windows PC
  # (both intermittent laptops, so their tagged jobs queue until the host
  # is online, e.g. when a branch is pushed for validation). Instance
  # (shared) runners are disabled for this project.
  tags: [linux, amd64, docker]

# Only run pipelines on the default branch (master), merge requests, and
# release tags. Transient fix-*/feat-* work branches are validated locally
# and merged to master (where the real pipeline runs), so a pipeline on the
# branch push is pure waste — and, since the branch is deleted right after
# the merge, its jobs fail at `get_sources` with "couldn't find remote ref"
# (an orphan-pipeline red X). This rule prevents that.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'                              # release tags (the release trigger)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MRs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'     # master (development)
    - when: never                                       # no work-branch / version-* pipelines

# BENCHMARK COMES AFTER COLLECT, and that order is the fix for
# benchmark-autocad-windows-hangs-and-blocks-release, not a tidying.
#
# `benchmark' used to sit between `test' and `release'. None of the release
# jobs declare `needs:', so they waited for the whole benchmark stage by
# stage order alone -- and benchmark:autocad:windows shares the Windows
# runner, which has concurrency 1, with release:windows:x86-64. A benchmark
# that hangs there therefore held the release lane behind it twice:
# release-1.8.47 was cancelled by hand, release-1.8.49 waited out the full
# two-hour timeout before its artefacts could even start.
#
# Capping the job (timeout: 15 minutes, 1.8.51) shortened that block; it did
# not remove it, because the ordering is what creates it. Putting the stage
# last does remove it: a benchmark is a measurement, never a release
# product, so nothing that ships may ever queue behind one.
#
# The measurement is NOT dropped from release pipelines -- it still runs on
# the tag, just after the artefacts are built and collected, so it keeps its
# value as a record and loses its power to cost a release. `pages' (the
# benchmark report, stage deploy) stays after it and still gets its inputs,
# which is why the stage goes here and not at the very end.
stages:
  - build
  - test
  - release
  - collect
  - benchmark
  - deploy

# --- Release-ref rule fragments (issues/closed/release-ci.issue) -------------
# A "release ref" is a release-* TAG (version-rules.md). Pipelines run on tags,
# MRs and master only — never on version-* pointer branches — so a release
# fires exactly ONE pipeline (the tag), not one per pointer. On the release
# tag the whole pipeline runs AUTOMATICALLY: build / test / verify / release /
# collect / deploy jobs are MANDATORY (a failure reddens the pipeline and
# blocks the release), while benchmarks stay allow_failure. Off the release
# tag, jobs keep their normal rules (manual for the intermittent CAD lanes,
# automatic for the poseidon test lanes). These anchors are spliced as the
# FIRST rule of a job so the release tag wins over the manual fallback.
.not-on-schedule: &not-on-schedule
  # The nightly schedule exists for ONE job: sweep:stale-child-pipelines.
  # Everything else stays off it. Without this, a scheduled pipeline on
  # master runs the whole test matrix at 03:00Z -- and native:pipeline
  # with it, which would create one more never-completing child every
  # night, feeding the very leak the sweep is there to drain
  # (ci-native-child-pipeline-creation-fails.issue).
  if: '$CI_PIPELINE_SOURCE == "schedule"'
  when: never

.on-release-mandatory: &on-release-mandatory
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
  when: on_success
  allow_failure: false
.on-release-benchmark: &on-release-benchmark
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
  when: on_success
  allow_failure: true

# Platform-bound release jobs: mandatory on a tag, unless the person cutting
# the release says the machine is not there.
#
# The obvious form -- gate on $WINDOWS_RUNNER == "online" from
# detect:runners -- DOES NOT WORK IN THE PARENT, and failed silently when
# tried on release-1.8.43: GitLab evaluates `rules:' at PIPELINE CREATION,
# before any job has run, so a variable published by detect:runners as a
# DOTENV ARTIFACT does not exist yet. The condition was never true, the
# `when: never' fallback won, and release:windows:x86-64 /
# release:darwin:arm64 were never created at all -- a release quietly
# missing two platforms WHILE BOTH MACHINES WERE ONLINE (detect:runners
# reported exactly that in the same pipeline). Worse than the blocking it
# replaced, and invisible.
#
# The child pipeline can do it because the parent passes those values as
# TRIGGER VARIABLES, which are known when the child is created. The parent
# cannot, so the intent is expressed explicitly instead: cutting a release
# with a machine switched off means saying so.
#
#   git tag ... && git push          -> Windows/macOS products expected
#   SKIP_WINDOWS_RELEASE=1 (CI var)  -> cut without the Windows products
#   SKIP_MACOS_RELEASE=1             -> likewise for macOS
#   ARM32_RELEASE=1                  -> ADD the qemu armv7 lane, which is
#                                       off by default because it is
#                                       blocked, not intermittent
#
# Explicit beats automatic here: the failure mode of the automatic version
# was a release that looked complete and was not.
.on-release-windows: &on-release-windows
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/ && $SKIP_WINDOWS_RELEASE != "1"'
  when: on_success
  allow_failure: false
.on-release-windows-absent: &on-release-windows-absent
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
  when: never
.on-release-macos: &on-release-macos
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/ && $SKIP_MACOS_RELEASE != "1"'
  when: on_success
  allow_failure: false
.on-release-macos-absent: &on-release-macos-absent
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
  when: never
# arm32 is OPT-IN, and it is the only lane that is. The other two are
# opt-out because they are INTERMITTENT -- the machine is either there or
# it is declared absent with SKIP_*_RELEASE, and a failure means something
# went wrong. The armv7 lane is not intermittent, it is BLOCKED: Debian's
# armhf SBCL is built without threads, and bordeaux-threads 0.9 refuses to
# load on a thread-less implementation ("This implementation is
# unsupported"), so the build dies before it can produce anything.
#
# It ran anyway until 1.9.0, on allow_failure, on the reasoning that it
# "contributes when it can". Three tags say otherwise: release-1.8.47 died
# that way after 44 minutes, release-1.9.0 after 48 (job 16026668734), and
# it has never once succeeded. A lane that cannot succeed does not
# contribute -- it spends the better part of an hour of an emulated runner
# and holds `collect' behind it, on every release.
#
# pjb, cutting 1.9.0: "we'll have to disable arm32 release for now."
#
# So the default is now OFF and the switch is positive: ARM32_RELEASE=1
# turns the lane back on, which is what to set the day the thread-less
# question is answered (native hardware, or a threaded armhf SBCL, or a
# bordeaux-threads that loads) -- and turning it on is then how you TEST
# that answer. SKIP_ARM32_RELEASE is deliberately not kept as an alias: a
# skip variable for a lane that no longer runs by default would only be
# read as evidence that it does. See
# issues/open/release-arm32-thread-less-sbcl.issue.
#
# allow_failure stays TRUE for the opt-in run, so re-enabling it to try a
# fix cannot block a release either.
.on-release-arm32: &on-release-arm32
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/ && $ARM32_RELEASE == "1"'
  when: on_success
  allow_failure: true
.on-release-arm32-absent: &on-release-arm32-absent
  if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
  when: never

# --- Windows shell-runner hygiene -------------------------------------------
#
# The runner's default `git clean -ffdx' also removes IGNORED files, i.e. the
# build output under dist/ and build/. On POSIX that is harmless: an open file
# can still be unlinked. On Windows it CANNOT -- a process holding a handle
# makes the delete fail, git clean returns non-zero, and the job dies in
# get_sources before a single line of its own script runs.
#
# That is not hypothetical. On the release-1.8.41 tag, two accoreconsole
# processes outliving their vendor-probe job kept
# dist/vendor-probes/autocad/drawing-data.log open, and EVERY Windows job of
# the pipeline failed on it -- release and both benchmarks -- with a message
# that names a log file and says nothing about a stale CAD process.
#
# So: on Windows the runner stops cleaning ignored files, and each job owns
# the output directory it writes. A job that cannot clear its own dist/ must
# say why (see scripts/release-windows.sh), because a release quietly built
# on top of a previous run's leftovers is worse than one that fails.
#
# Deliberately NOT applied to the Linux/macOS runners: there the -ffdx clean
# works and catches stale-artefact bugs, which is worth keeping.
.windows-clean: &windows-clean
  GIT_CLEAN_FLAGS: -ffd

# Build the CI image with kaniko — NO Docker daemon, NO privileged, NO
# socket exposure. The poseidon group runner is rootless docker
# (privileged=false), so a docker:dind service cannot start (it would fail
# with "Cannot connect to the Docker daemon at tcp://docker:2375"). kaniko
# builds the image inside the job container and pushes straight to the
# GitLab registry — the same approach the bocl project uses.
build:clautolisp-ci-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  # Transient network failures (e.g. the CCL download from GitHub) should
  # not fail a whole pipeline run.
  retry: 2
  rules:
    - *not-on-schedule
    # Never rebuild the image on a release tag: use the already-published
    # :latest. (Otherwise a flaky image build blocks the release stage.)
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        - .gitlab-ci.yml
        - Makefile
        - clautolisp/Makefile
        - clautolisp/clautolisp.asd
        - clautolisp/docker/Dockerfile
      when: on_success
    - when: never
  script:
    - |
      mkdir -p /kaniko/.docker
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
      # :$CI_COMMIT_SHA always; :latest only on the default branch.
      DESTS="--destination $CLAUTOLISP_CI_IMAGE:$CI_COMMIT_SHA"
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && DESTS="$DESTS --destination $CLAUTOLISP_CI_LATEST"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/clautolisp/docker/Dockerfile" \
        $DESTS \
        --cache=true \
        --cache-repo "$CLAUTOLISP_CI_IMAGE/cache"

# The clautolisp/autolisp-debug subsystem depends on bordeaux-threads
# (added in the debugger merge). The Docker image's Quicklisp install
# fetches it on demand but the SBCL run that follows must run *with*
# the install dir on its load path. Pre-warm it here so make
# test-sbcl's --non-interactive run finds it without a recursive
# quickload prompt.
.pre-warm-quicklisp-sbcl: &pre-warm-quicklisp-sbcl
  - sbcl --noinform --no-userinit --non-interactive
         --load /root/quicklisp/setup.lisp
         --eval '(ql:quickload (list "fiveam" "bordeaux-threads" "trivial-gray-streams" "babel" "alexandria") :silent t)'

.pre-warm-quicklisp-ccl: &pre-warm-quicklisp-ccl
  - ccl --no-init -b
        -e '(load "/root/quicklisp/setup.lisp")'
        -e '(ql:quickload (list "fiveam" "bordeaux-threads" "trivial-gray-streams" "babel" "alexandria") :silent t)'
        -e '(ccl:quit)'

test:clautolisp:sbcl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - *pre-warm-quicklisp-sbcl
    - make -C clautolisp test-sbcl

test:clautolisp:ccl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - *pre-warm-quicklisp-ccl
    - make -C clautolisp test-ccl

test:clautolisp:file-compat:sbcl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - mkdir -p clautolisp/.artifacts
    - make -C clautolisp run-file-compat-sbcl FILE_COMPAT_ARGS="--tag builtin --report-format json --output .artifacts/file-compat-sbcl.json"
    - cat clautolisp/.artifacts/file-compat-sbcl.json
  artifacts:
    when: always
    paths:
      - clautolisp/.artifacts/file-compat-sbcl.json

test:clautolisp:file-compat:ccl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - mkdir -p clautolisp/.artifacts
    - make -C clautolisp run-file-compat-ccl FILE_COMPAT_ARGS="--tag builtin --report-format json --output .artifacts/file-compat-ccl.json"
    - cat clautolisp/.artifacts/file-compat-ccl.json
  artifacts:
    when: always
    paths:
      - clautolisp/.artifacts/file-compat-ccl.json

# ---------------------------------------------------------------------
# autolisp-test + alfe lanes — parity with the GitHub Actions workflow
# (.github/workflows/ci.yml). GitLab CI ran a narrower matrix until
# now (clautolisp-only); the autolisp-front-end / autolisp-test lanes
# only existed on GitHub, which is why a clutch of fresh-checkout
# bugs (cache key, save-image dir, --dry-run engine probe) sailed
# through GitLab's pipeline while breaking on GitHub. Adding them
# here keeps both CIs symmetrical.

test:autolisp-test:sbcl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - make -C autolisp-test test

test:alfe:sbcl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - make -C autolisp-front-end test-sbcl

test:alfe:ccl:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - make -C autolisp-front-end test-ccl

test:alfe:conformance:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - make -C autolisp-front-end conformance

test:alfe:spec-coverage:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  script:
    - make -C autolisp-front-end check-spec-coverage

# --- SCHMS CAD corpus, headless on poseidon --------------------------------
#
# The SCHMS+ suite (`make test-cad-clautolisp`) is the end-to-end consumer
# that keeps surfacing gaps in the vlax / VLA surface — vla-accessor-family
# and vla-entity-property-bridge were both driven by its failures, and the
# latter's remaining item is literally "re-run SCHMS to confirm what it
# consumes". It runs against `--host cador`, i.e. the headless CAD core, so
# unlike every other CAD lane it needs NO AutoCAD, NO BricsCAD and no native
# runner: poseidon [linux, amd64, docker] is the right home for it.
#
# INERT UNTIL PROVISIONED. SCHMS is a private client corpus
# (sncf-reseau/src/schms), not a submodule and not public, so this job
# cannot clone it without credentials. The first rule makes the job simply
# not exist until pjb defines SCHMS_REPO_URL, exactly like
# BRICSCAD_PROFILE_CLEAN gates the sysvar harvest and RUNNER_STATUS_TOKEN
# gates the runner probe — never a false red, never a stuck-pending job.
#
# pjb must provide, as masked CI/CD variables:
#   SCHMS_REPO_URL    clone URL for the SCHMS corpus, credentials included
#                     (e.g. https://gitlab-ci-token:<PAT>@host/group/schms.git)
#   SCHMS_REF         optional; branch/tag to test (default: the repo default)
#
# Non-gating on purpose (allow_failure): SCHMS is an external corpus whose
# own churn must never redden a clautolisp pipeline. Its value is the
# report, and the artifact is the report.
test:cad:schms:linux:
  stage: test
  tags: [linux, amd64, docker]
  variables:
    GIT_SUBMODULE_STRATEGY: none
    SCHMS_DIR: "$CI_PROJECT_DIR/../schms"
  rules:
    - *not-on-schedule
    # No credentials configured => the job does not exist at all.
    - if: '$SCHMS_REPO_URL == null || $SCHMS_REPO_URL == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true
  script:
    # Install clautolisp where the corpus expects to find it on PATH. The
    # programs phase only (install-documentation needs the TeX/Emacs
    # toolchain this image does not carry, and SCHMS needs none of it).
    - make install-programs PREFIX="$CI_PROJECT_DIR/stage"
    - export PATH="$CI_PROJECT_DIR/stage/bin:$PATH"
    - clautolisp --version
    - rm -rf "$SCHMS_DIR"
    - git clone --depth 1 ${SCHMS_REF:+--branch "$SCHMS_REF"} "$SCHMS_REPO_URL" "$SCHMS_DIR"
    # The corpus drives clautolisp itself; host=cador is the headless CAD
    # core, which is what makes this runnable off a CAD runner at all.
    - make -C "$SCHMS_DIR" test-cad-clautolisp 2>&1 | tee schms-report.txt
  artifacts:
    name: "schms-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [schms-report.txt]
    expire_in: 30 days

# Mirror of the GitHub `alfe-binary` job: build alfe-sbcl, assert
# its --version matches the source-declared version, smoke-test the
# headline `--clautolisp -x '(princ (+ 1 2))'` invocation, and
# publish the binary as a GitLab artifact for downstream consumers.
#
# NOTE: alfe -x does NOT auto-print its expression value (see
# issues/closed/doc-x-output-semantics.issue) — the smoke test
# wraps in (princ ...) explicitly. The --no-init flag suppresses
# user / system init-file output so the captured stdout is just
# the (princ) value.
build:alfe:sbcl:
  rules:
    - *not-on-schedule
    - when: on_success
  # A build: job belongs in the build stage (issues/open/release-ci.issue) so
  # it runs before the test lanes that `needs:` its artifact.
  stage: build
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - |
      declared=$(sed -n 's/.*\*version\* "\([^"]*\)".*/\1/p' \
                     autolisp-front-end/tools/alfe/source/version.lisp)
      actual=$(autolisp-front-end/tools/alfe/bin/alfe-sbcl --version)
      echo "declared: $declared"
      echo "actual:   $actual"
      [ "$actual" = "alfe $declared" ]
    - |
      output=$(autolisp-front-end/tools/alfe/bin/alfe-sbcl \
                 --no-init --clautolisp -x '(princ (+ 1 2))')
      echo "output: $output"
      [ "$output" = "3" ]
  artifacts:
    when: always
    paths:
      - autolisp-front-end/tools/alfe/bin/alfe-sbcl
    expire_in: 14 days

# --- release packaging checks -----------------------------------------
#
# Deliberately NOT folded into the `documentation' job, which is skipped on
# tags — precisely the pipeline where a release is being cut. This runs on
# merge requests, on master AND on tags, in the `test' stage so a tag
# pipeline fails here rather than after the whole release matrix has built.
#
# Cheap: fabricates artefacts and repackages them, no build, no CAD, a
# couple of seconds. See release-artefact-set-incomplete.issue for what it
# is defending against — 7 of the 10 specified artefacts were missing, and
# reading the recipe had not revealed it.
check:release:
  rules:
    - *not-on-schedule
    - when: on_success
  stage: test
  tags: [linux, amd64, docker]        # poseidon (always-on)
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    # zip/unzip are needed for the Windows .zip artefacts and the -all.zip
    # (pjb, 2026-08-16). collect-artefacts ERRORS rather than skipping when
    # they are missing, so a release cannot quietly ship without them.
    - pkgs=""; for t in bzip2 tar make zip unzip; do command -v $t >/dev/null 2>&1 || pkgs="$pkgs $t"; done; [ -z "$pkgs" ] || { apt-get update && apt-get install -y $pkgs; }
  script:
    - make check-release

# Build the documentation on ordinary pipelines (default branch + merge
# requests) and publish it as a SHORT-lived job artefact, structured exactly
# like install-documentation (share/doc/<sub>/…, share/info/…) inside
# clautolisp-<ver>-documentation.tar.bz2 — the same artefact the release lane
# produces, only with a short expiry. Skipped on tags (release:documentation
# produces the long-lived release artefact there) and on feature branches (the
# Emacs paged split + xelatex across four subprojects is slow). Runs on the
# always-on poseidon box; the stock CI image is a Lisp image, so the
# before_script installs the doc toolchain (same set as release:documentation).
documentation:
  stage: test
  tags: [linux, amd64, docker]        # poseidon (always-on)
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none      # docs need no native submodule
  rules:
    - *not-on-schedule
    - if: '$CI_COMMIT_TAG'            # tags: release:documentation handles it
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  # Reuse the slow paged-split cache (mirrors .release-common): keyed on the
  # spec org + the split driver; build/ also now holds the rendered PDFs.
  cache:
    key:
      files:
        - autolisp-spec/documentation/autolisp-visual-lisp-specification-draft.org
        - autolisp-spec/scripts/build-paged-spec.el
    paths:
      - autolisp-spec/build/
  before_script:
    # doc tooling is baked into the CI image; install only what's missing
    # (a fallback for a stale :latest right after the Dockerfile change).
    - pkgs=""; command -v emacs >/dev/null || pkgs="$pkgs emacs-nox"; command -v xelatex >/dev/null || pkgs="$pkgs texlive texlive-latex-extra texlive-xetex texlive-plain-generic"; command -v makeinfo >/dev/null || pkgs="$pkgs texinfo"; command -v dot >/dev/null || pkgs="$pkgs graphviz"; command -v fc-list >/dev/null || pkgs="$pkgs fontconfig"; [ -z "$pkgs" ] || { apt-get update && apt-get install -y $pkgs; }
    # The doc fonts are NOT optional decoration: the preamble maps glyphs onto
    # them, and every fallback is guarded, so a missing font degrades to a
    # dropped glyph in a PDF that still builds. Install them, and let
    # check-doc-glyph-coverage below verify the result rather than trust it.
    - 'fonts=""; have() { fc-list --format "%{family}\n" 2>/dev/null | grep -q "$1"; }; have "DejaVu Serif" || fonts="$fonts fonts-dejavu"; have "Symbola" || fonts="$fonts fonts-symbola"; have "Noto Sans CJK" || fonts="$fonts fonts-noto-cjk"; [ -z "$fonts" ] || { apt-get update && apt-get install -y $fonts; }'
    - command -v emacs makeinfo xelatex dot fc-list >/dev/null
  script:
    # The dialect-warnings annex is generated from the register in
    # autolisp-runtime/source/portability.lisp and TRACKED, so it can go
    # stale the moment someone improves an entry without regenerating.
    # Fail here rather than ship a manual that disagrees with what the
    # program prints.
    - make -C clautolisp check-dialect-warnings-annex
    # The user-visible rule (AGENTS.md): a CLI option or CLAL- builtin that
    # reaches no manual fails here. Run BEFORE the build -- it is seconds,
    # and the point is to fail on the documentation gap rather than after
    # several minutes of LaTeX.
    - make check-user-visible-documentation
    # XeLaTeX has NO font fallback: a glyph the body face lacks is dropped,
    # the PDF is produced successfully, and the character is simply gone.
    # Cheap and BEFORE the build, for the same reason as the check above --
    # and it needs fontconfig + the doc fonts to answer, which is why the
    # before_script installs them (tex-pdf-characters.issue).
    - make check-doc-glyph-coverage
    # The Info export used to be 51 minutes of this job -- 94% of it -- so
    # the job skipped it with SPEC_PAGED_TARGETS="pages html" and left the
    # manual to release:documentation. The cost was ox-texinfo naming nodes
    # against a growing ALIST, which is quadratic in the number of nodes;
    # autolisp-spec/scripts/spec-texinfo-fast-node.el replaces that lookup
    # and the export now takes 60 seconds
    # (doc-build-info-export-quadratic.issue).
    #
    # So the skip is GONE and merge requests build the Info manual again.
    # That matters beyond the minutes: while it was skipped, the only lane
    # that built the manual was the release lane, so a spec edit that broke
    # the Info build could only be found ON a release.
    #
    # This runs first, and it is three seconds: it exports a prefix of the
    # real spec with and without the override and fails unless the two are
    # byte-identical. The override is pinned to an INTERNAL org function, so
    # an org upgrade could change node names under us; without this check
    # that drift would surface much later, as dead cross-references.
    - make -C autolisp-spec check-info-export-equivalence
    - make release-documentation
  artifacts:
    name: "clautolisp-documentation-$CI_COMMIT_SHORT_SHA"
    paths: [dist/]
    expire_in: 1 week

# --- Release artefacts (see issues/open/release-artefacts.issue) -------
#
# On a version tag, produce the source / documentation / programs /
# libraries artefacts. The ogamita-group runner on poseidon + CI image
# cover Linux x86-64 only; the other five SBCL targets need dedicated runners
# (macOS, Windows, arm64) and are tracked in the issue — the GitHub
# Actions release workflow scaffolds the full 6-target matrix.

# --- Release artefacts (issues/open/release-artefacts.issue) -----------
#
# Per-target jobs build + package on a version tag (v* / clautolisp-v*),
# or manually. Runners are selected by configuration tags
# <os>,<arch>,<executor> (see documentation/self-hosted-runners.md):
#   [linux, amd64, docker]  -> poseidon  (always-on Linux compute box)
#   [linux, arm64, qemu]    -> poseidon  (arm64 via qemu-user emulation)
#   [linux, arm32, qemu]    -> poseidon  (arm32/armhf via qemu; for arm32 lanes)
#   [linux, arm64, docker]  -> thalassa  (NATIVE linux/arm64; optional validation)
#   [macos, arm64, shell]   -> thalassa  (native macOS build; intermittent)
#   [windows, amd64, shell] -> windows PC (intermittent)
# thalassa + windows are laptops with intermittent connectivity, so their
# tagged jobs queue until the host is online (e.g. on a validation push).
# arm64 targets are SBCL-only: Clozure CL has no arm64 build.
# Windows targets need a Windows runner (paid SaaS, or a Win11-ARM VM
# with its own runner) — not provided here yet.

.release-common:
  stage: release
  # DOWNLOAD NOTHING. Without this, GitLab's default applies -- a job with
  # no `needs:' receives the artifacts of EVERY job in every earlier stage
  # -- and build:alfe:sbcl publishes exactly
  # autolisp-front-end/tools/alfe/bin/alfe-sbcl, built on LINUX.
  #
  # On the release-1.9.0 tag that Linux ELF landed at that path in the
  # WINDOWS lane's workspace, where the Windows build then wrote its own
  # alfe-sbcl.exe beside it. The packaging loop tested the bare name first,
  # found the ELF, and shipped a Linux binary as the Windows alfe. macOS
  # escaped only by luck: there the built name IS the bare name, so the
  # build overwrote the download.
  #
  # `dependencies: []' and not `needs: []': needs would also detach the job
  # from stage ordering and let a release start before the tests, which is
  # not the intent. dependencies only says "fetch no artifacts".
  # See windows-release-binaries-lose-exe.issue.
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive   # libredwg (+ jsmn) needed by build-libraries
  rules:
    - *not-on-schedule
    - *on-release-mandatory
    - when: manual
      allow_failure: true
  # Cache the slow autolisp-spec paged split (3026 sections -> html/info/
  # pages); keyed on the spec org + the split driver.
  cache:
    key:
      files:
        - autolisp-spec/documentation/autolisp-visual-lisp-specification-draft.org
        - autolisp-spec/scripts/build-paged-spec.el
    paths:
      - autolisp-spec/build/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:linux:x86-64:
  extends: .release-common
  image: $CLAUTOLISP_CI_LATEST
  variables:
    RELEASE_LISPS: "sbcl ccl"     # x86-64 ships both SBCL + CCL (arm64 lanes stay sbcl-only by default)
  before_script:
    # bzip2 (tar -cjf) and zip are required by the release-* packaging;
    # cmake by build-libraries. Install whatever the image lacks (the CI
    # image gains them once it is rebuilt from master; this keeps tag
    # pipelines working in the meantime).
    - pkgs=""; for t in cmake bzip2 zip; do command -v $t >/dev/null 2>&1 || pkgs="$pkgs $t"; done; [ -z "$pkgs" ] || { apt-get update && apt-get install -y $pkgs; }
  script:
    - make release-sources
    - make build-libraries
    - make release-programs
    - make release-libraries
    # Refuse to hand up an empty dist/: a lane that built nothing must
    # not look like a lane that built everything (see the Makefile).
    - make verify-release-artefacts
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-linux-x86-64"
    paths: [dist/]
    expire_in: 30 days

# Documentation is its OWN lane (mirrors the GitHub `documentation` job)
# so each forge independently produces the complete release set. It is
# slow (Emacs paged split of 3026 sections + xelatex PDFs across four
# subprojects) but platform-agnostic, so it runs on poseidon (the
# always-on Linux box) rather than the intermittent macOS laptop. The
# stock CI image is a Lisp image, so the before_script installs the doc
# toolchain — the SAME package set the GitHub `documentation` job uses
# (.github/workflows/release.yml). TODO: bake these into the CI image's
# Dockerfile to drop the per-run apt install.
release:documentation:
  extends: .release-common
  tags: [linux, amd64, docker]        # poseidon (always-on)
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none      # docs need no native submodule
  before_script:
    # Emacs (autolisp-spec paged split), TeX/xelatex (PDFs), makeinfo (Info).
    # doc tooling is baked into the CI image; install only what's missing
    # (a fallback for a stale :latest right after the Dockerfile change).
    - pkgs=""; command -v emacs >/dev/null || pkgs="$pkgs emacs-nox"; command -v xelatex >/dev/null || pkgs="$pkgs texlive texlive-latex-extra texlive-xetex texlive-plain-generic"; command -v makeinfo >/dev/null || pkgs="$pkgs texinfo"; command -v dot >/dev/null || pkgs="$pkgs graphviz"; [ -z "$pkgs" ] || { apt-get update && apt-get install -y $pkgs; }
    - command -v emacs makeinfo xelatex dot >/dev/null
  script:
    - make release-documentation
    # The Info manual is built HERE and nowhere else: the
    # merge-request lane skips it (see the documentation job). Its
    # install step is guarded by `if [ -f ]', so a build that quietly
    # failed to produce it would ship a documentation artefact without
    # it and say nothing. This is the lane that publishes it, so it
    # asserts instead of hoping.
    - 'test -f autolisp-spec/build/info/autolisp-spec.info || { echo "ERROR - the Info manual was not built, and this is the lane that publishes it."; exit 1; }'
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-documentation"
    paths: [dist/]
    expire_in: 30 days

release:linux:arm64:
  extends: .release-common
  # poseidon (always-on) builds arm64 under qemu-user emulation. The base
  # image is pinned to its arm64 manifest digest ($ARM64_BASE) so the daemon
  # pulls the arm64 image (the runner `platform` key is ignored by
  # gitlab-runner 19.1); binfmt then runs it. thalassa's native
  # [linux,arm64,docker] runner is kept for optional native validation.
  tags: [linux, arm64, qemu]      # poseidon qemu (was thalassa native)
  image: $ARM64_BASE              # buildpack-deps bookworm, arm64 (digest-pinned)
  # Cache the libredwg cmake build dir so the slow (emulated) C compile is
  # reused across runs — cmake rebuilds only changed objects. Per-arch key
  # (objects are arch-specific). Interim measure (b); the durable fix (a) is
  # baking libredwg into a per-arch CI image. Bump -v2 to force a cold build.
  cache:
    key:
      prefix: libredwg-arm64-v1
      files:
        - .gitmodules
        - clautolisp/drawing-dwg/build-libredwg.sh
    paths:
      - clautolisp/third-party/libredwg/build/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sbcl cmake m4
    - curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -4 -o /tmp/ql.lisp https://beta.quicklisp.org/quicklisp.lisp
    - sbcl --non-interactive --load /tmp/ql.lisp --eval '(quicklisp-quickstart:install)'
  script:
    - make build-libraries          # vendored libdwg + shim (emulated arm64)
    - make build-programs           # SBCL arm64 images (no CCL on arm64)
    - make release-programs
    - make release-libraries
    # Refuse to hand up an empty dist/: a lane that built nothing must
    # not look like a lane that built everything (see the Makefile).
    - make verify-release-artefacts
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-linux-arm64"
    paths: [dist/]
    expire_in: 30 days

# armv7 (32-bit ARM, Raspberry-Pi class). DOES NOT BUILD UNDER QEMU — so it
# is `when: manual` + allow_failure (never auto-runs, never blocks) and tagged
# for a NATIVE arm32 docker host that doesn't exist yet (a Pi); it just queues
# until one is registered. Confirmed by direct probes on poseidon (2026-06-22):
#   - SBCL: Debian armhf SBCL 2.2.9 is built WITHOUT threads (sb-thread absent),
#     so bordeaux-threads v0.9.4 rejects it ("This implementation is
#     unsupported"). A native Pi with Debian's SBCL hits the same wall — arm32
#     SBCL needs a thread-enabled SBCL build. Hence RELEASE_LISPS=ccl here.
#   - CCL: armcl runs trivially but FAULTS under qemu-user the moment it uses
#     threads ("Fault during read of memory address #x0" in CCL::%INIT-MISC);
#     it works only on NATIVE armv7.
# arm64, by contrast, has a threaded SBCL and builds fine under qemu.
release:linux:arm32:
  extends: .release-common
  tags: [linux, arm32, qemu]      # poseidon qemu (pjb adds the arm32 tag); native Pi welcome later
  image: $ARMV7_BASE              # buildpack-deps bookworm, armv7/armhf (digest-pinned)
  variables:
    # SBCL only: armhf SBCL is thread-less (Debian), which clautolisp
    # tolerates — the default debugger is synchronous in-image; only the
    # threaded aldb session mode would error if used. CCL armcl FAULTS
    # under qemu-user (tested on poseidon), so it stays off this lane.
    RELEASE_LISPS: "sbcl"
  rules:
    # Automatic on a release tag, like every other platform lane. It used
    # to be manual-only, and that quietly cost two releases their arm32
    # products: collect:release needs this job, and GitLab SKIPS a job
    # whose need is an unplayed manual one. `optional: true' does NOT
    # rescue that -- optional only covers a job that is ABSENT from the
    # pipeline, and a manual job is present, merely unplayed. 1.8.43
    # published nothing for this reason; 1.8.46 escaped it only because
    # the job happened to be played by hand.
    #
    # Off a release tag it stays an opt-in experiment.
    - *on-release-arm32
    - *on-release-arm32-absent
    - when: manual
      allow_failure: true
  # Cache the libredwg cmake build dir (see arm64 lane) — the emulated armv7
  # C compile is the slowest step; reusing objects across runs is the (b)
  # time-saver until libredwg is baked into a per-arch CI image (a).
  cache:
    key:
      prefix: libredwg-arm32-v1
      files:
        - .gitmodules
        - clautolisp/drawing-dwg/build-libredwg.sh
    paths:
      - clautolisp/third-party/libredwg/build/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sbcl cmake m4
    # CCL v1.13 32-bit ARM: the linuxarm tarball holds armcl/armcl.image at its
    # ROOT (no ccl/ prefix), so extract INTO /opt/ccl; `ccl` wrapper on PATH.
    - |
      # Skip THIS STEP when ccl is not wanted -- never `exit 0'. GitLab
      # concatenates before_script and script into one shell, so an exit
      # here ends the whole job, and ends it GREEN: the runner uploads an
      # empty dist/ and the release quietly loses this platform. That is
      # exactly how release-1.8.46 shipped without its linux-arm32
      # artefacts, with a successful 35-second job as the only trace.
      case " $RELEASE_LISPS " in
        *" ccl "*)
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -4 \
               -o /tmp/linuxarm.tar.gz \
               https://github.com/Clozure/ccl/releases/download/v1.13/linuxarm.tar.gz
          mkdir -p /opt/ccl && tar -xzf /tmp/linuxarm.tar.gz -C /opt/ccl
          printf '%s\n' '#!/bin/sh' 'exec /opt/ccl/armcl "$@"' > /usr/local/bin/ccl
          chmod +x /usr/local/bin/ccl
          ccl --no-init --eval '(progn (format t "CCL ~a on ~a~%" (lisp-implementation-version) (machine-type)) (ccl:quit))'
          ;;
        *)
          echo "ccl not in RELEASE_LISPS — skipping CCL install"
          ;;
      esac
    - curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -4 -o /tmp/ql.lisp https://beta.quicklisp.org/quicklisp.lisp
    - sbcl --non-interactive --load /tmp/ql.lisp --eval '(quicklisp-quickstart:install)'
  script:
    - make build-libraries          # vendored libdwg + shim (armv7)
    - make build-programs           # loops RELEASE_LISPS -> build-sbcl + build-ccl
    - make release-programs
    - make release-libraries
    # Refuse to hand up an empty dist/: a lane that built nothing must
    # not look like a lane that built everything (see the Makefile).
    - make verify-release-artefacts
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-linux-arm32"
    paths: [dist/]
    expire_in: 30 days

release:darwin:arm64:
  extends: .release-common
  tags: [macos, arm64, shell]     # thalassa (intermittent): native macOS arm64 build
  rules:
    - *on-release-macos
    - *on-release-macos-absent
    - when: manual
      allow_failure: true
  before_script:
    # The workstation provides the toolchain (MacPorts: sbcl, cmake; cc
    # via Xcode) and Quicklisp at ~/quicklisp/. SBCL-only on arm64.
    - command -v sbcl cmake cc >/dev/null
  script:
    - make build-libraries          # vendored libdwg + shim (native arm64)
    - make build-programs           # SBCL arm64 images
    - make release-programs
    - make release-libraries
    # Refuse to hand up an empty dist/: a lane that built nothing must
    # not look like a lane that built everything (see the Makefile).
    - make verify-release-artefacts
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-darwin-arm64"
    paths: [dist/]
    expire_in: 30 days

# Windows x86-64 — real packaging (was a STUB until 2026-08-16).
#
# pjb built the Windows zips with `make release' from an MSYS2 bash with no
# trouble, so this lane does the same rather than reimplementing packaging
# in PowerShell.
#
# The PowerShell -> MSYS2 handoff follows run-forest-run, which pjb pointed
# at as the place where it is normalised; scripts/avec-bash.ps1 and
# scripts/environnement-windows.sh are adapted from it (see their headers).
# The three findings that make the difference, each learned the hard way
# there rather than here:
#
#   - MSYS2_PATH_TYPE=inherit, or the login profile REPLACES the Windows
#     PATH and sbcl disappears;
#   - MINGW64 before UCRT64, because build-libredwg.sh refuses UCRT64 and
#     CLANG64 for the native codec (they import private UCRT API sets that
#     native SBCL lacks). Picking "whatever is installed" is taking the
#     observation for a criterion;
#   - CC set on the BASH side in POSIX form: from PowerShell it arrives as
#     "C:/msys64/..." and CMake truncates it at the colon, which is the
#     real content of build-tool-paths-unquoted.issue.
#
# The artefacts are .zip here and .tar.bz2 everywhere else: the Makefile's
# pack-release-artefact branches on the target OS (pjb, 2026-08-16). No
# PowerShell packaging code exists, so there is nothing to keep in step.
#
# SHAKEDOWN PENDING: like the vendor probes before it, this needs its first
# run on the real runner to settle. RELEASE_LISPS is sbcl-only until a CCL
# build is confirmed on that box.
release:windows:x86-64:
  extends: .release-common
  tags: [windows, amd64, shell]   # windows PC (intermittent): GUI bricscad/autocad host
  # 100%-MANUAL FALLBACK. The PRIMARY release Windows build is GitHub Actions
  # (.github/workflows/release.yml — the CAD-free always-available host,
  # windows-build-host.issue / !129); collect:release pulls that artefact via
  # `gh run download`. This self-hosted lane stays only as an on-demand native
  # build/check, so it is NOT auto-scheduled on a tag and NOT a collect need
  # (check-release-collect-needs.sh exempts it as collected out-of-band).
  rules:
    - when: manual
      allow_failure: true
  variables:
    <<: *windows-clean
    MSYS2_ROOT: 'C:\msys64'
    RELEASE_LISPS: "sbcl"
  script:
    # scripts/avec-bash.ps1 owns the PowerShell -> MSYS2 handoff: it picks
    # MSYS2's bash over Git's, sets MSYS2_PATH_TYPE=inherit so the login
    # profile does not wipe the Windows PATH (sbcl lives there), and selects
    # the subsystem with MINGW64 FIRST -- the DWG codec refuses UCRT64 and
    # CLANG64. It deliberately does not set CC; the bash side does, because
    # a CC crossing the PowerShell boundary comes out as "C:/..." and CMake
    # truncates it at the colon.
    - '& scripts/avec-bash.ps1 scripts/release-windows.sh'
    # PowerShell does NOT fail a step on a native program's non-zero exit,
    # so without this check the job would go green over a failed build and
    # the release would come up two artefacts short.
    - 'if ($LASTEXITCODE -ne 0) { throw "Windows release packaging failed ($LASTEXITCODE)" }'
    - 'Get-ChildItem dist'
  # UPLOAD THE TWO ZIPS, NOT THE WHOLE dist/, because the whole dist/
  # cannot be uploaded from this machine at all.
  #
  # On the release-1.9.1 tag this job built correctly, passed every
  # artefact check, and then died three times on
  #
  #   dist/: found 362 matching artifact files and directories
  #   ERROR: Uploading artifacts as "archive" to coordinator... error
  #   WARNING: Retrying...  context=artifacts-uploader  error=invalid argument
  #
  # A full retry from scratch (job 16032976102, 20 minutes of cold build)
  # reproduced it exactly, so it is DETERMINISTIC, not a flake -- which is
  # what rules out simply retrying until green.
  #
  # Two zips are all `collect:release' takes from this lane anyway; the
  # other 360 entries are staging left in dist/ by the packaging step and
  # have no consumer. Narrowing removes whatever the uploader objects to
  # -- the count, or a path in that staging tree (Windows MAX_PATH is a
  # standing suspect) -- without needing to know which, and it is the
  # cheapest of the four options in
  # windows-artifact-upload-fails-on-release.issue.
  #
  # If it still fails, the failure has been narrowed to two files, which
  # is itself the next piece of evidence.
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-windows-x86-64"
    paths:
      - dist/clautolisp-*-binaries-windows-x86-64.zip
      - dist/clautolisp-*-libraries-windows-x86-64.zip
    expire_in: 30 days

# --- platform verification: the vl-registry backends (vl-registry.issue) ---
#
# The Windows-registry and macOS-defaults backends cannot be exercised on
# the linux CI (they are feature-gated out); these MANUAL jobs run
# scripts/verify-vl-registry.lisp against the REAL platform store on the
# intermittent native runners (needs sbcl on the machine). allow_failure:
# the runners are laptops with intermittent connectivity.
# --- platform test jobs: the full suite on the native runners --------------
#
# The linux docker lanes cover amd64; these MANUAL jobs run the same
# clautolisp test suite natively on the intermittent macOS / Windows
# runners, so platform-specific behavior (pathnames, encodings, registry,
# process spawning) gets validated on the real OS. They use the machine's
# own sbcl + ~/quicklisp (both runners build releases, so the toolchain is
# there). allow_failure: intermittent laptops must never block a pipeline.
# --- Runner-availability gating (detect + child pipeline) ------------------
# The macOS/Windows runners are intermittent laptops. Native jobs can't be
# gated by plain rules: (evaluated at pipeline creation, blind to the runtime
# runner state), nor by "playing" manual jobs from an orchestrator (a manual
# job stays `created`, unplayable, until its stage/needs are ready). So:
#   detect:runners  — on the always-on Linux runner, records which native
#                     runners are ONLINE into a dotenv;
#   native:pipeline — triggers the CHILD pipeline .gitlab/native.yml, passing
#                     those variables; the child's native jobs' rules: are
#                     evaluated at the CHILD's creation (variables now KNOWN)
#                     => on_success when the runner is online, `manual`
#                     (non-blocking fallback) when it is offline.
# See runner-availability-gating.issue.
#
# FAIL-SAFE: no RUNNER_STATUS_TOKEN (api scope) or any API error => offline =>
# the child's native jobs are manual (today's behaviour). Never a false online.
# --- nightly hygiene ---------------------------------------------------
#
# The native child pipeline never completes on its own: its jobs are
# `manual' whenever their runner is offline, so the child stays ACTIVE and
# its jobs keep counting against the project's jobs-in-active-pipelines
# cap. One immortal pipeline per push. That cap was reached on 2026-08-19
# -- 17 children still `running', the oldest seven hours old -- and no new
# child could be created, which turned every pipeline in the project red
# with zero failed jobs (ci-native-child-pipeline-creation-fails.issue).
#
# `default: interruptible: true' in .gitlab/native.yml lets GitLab
# auto-cancel a child once a NEWER pipeline supersedes it. That covers a
# branch pushed repeatedly, and only that: a ref pushed once and then
# abandoned -- a merge request merged from its last push, the normal case
# -- has nothing to supersede it. This drains those.
#
# It is a broom, not a fix, and it is scheduled rather than reactive for
# exactly that reason. SWEEP_MAX_AGE_HOURS tunes it without touching code.
sweep:stale-child-pipelines:
  stage: .pre
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # At 03:00Z this clears everything from before 15:00Z the day before,
    # leaving the previous evening's children still clickable in the
    # morning -- the manual jobs exist to be played when a laptop comes
    # back online, and a sweep that removed them the same night would take
    # that away.
    SWEEP_MAX_AGE_HOURS: "12"
  rules:
    # The nightly schedule runs this and nothing else: every other job
    # carries *not-on-schedule.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    # And by hand, from any pipeline, for the day the bucket fills early.
    - when: manual
      allow_failure: true
  script:
    - python3 scripts/cancel-stale-child-pipelines.py

detect:runners:
  stage: .pre
  tags: [linux, amd64, docker]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - *not-on-schedule
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - python3 scripts/ci-detect-runners.py runners.env
    - cat runners.env
  artifacts:
    reports:
      dotenv: runners.env

native:pipeline:
  stage: test
  needs:
    - job: detect:runners
      artifacts: true
  variables:
    MACOS_RUNNER: "$MACOS_RUNNER"
    WINDOWS_RUNNER: "$WINDOWS_RUNNER"
  rules:
    - *not-on-schedule
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  trigger:
    include: '.gitlab/native.yml'
    # NB: no `strategy: depend` — when the runner is offline the child's jobs
    # are `manual` and the child pipeline never "completes", so depending on it
    # would hang this parent job (re-creating the pile-up we're avoiding). The
    # child runs independently; its jobs are allow_failure anyway.

# NOTE: build:alfe:{macos,windows} moved to the child pipeline
# .gitlab/native.yml so they are runner-availability gated (on_success when
# the runner is online — a native "does alfe build on this OS" check). The
# benchmark:*:cad jobs below no longer `needs:` them; they self-build alfe.

.encoding-experiment:
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  interruptible: true
  # MANUAL: a dev-time exploratory experiment (reason-1), not a gate.
  rules:
    - *not-on-schedule
    - when: manual
      allow_failure: true
  artifacts:
    name: "encoding-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/encoding/]
    expire_in: 30 days

encoding:experiment:clautolisp:linux:
  extends: .encoding-experiment
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-encoding-experiment.sh --backend clautolisp

.pathname-probe:
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  interruptible: true
  # MANUAL: the "." / ".." resolution was captured (see
  # cad-path-dotdot-resolution.issue); keep the jobs available to re-run
  # on demand (a runner is up) without firing on every pipeline.
  rules:
    - when: manual
      allow_failure: true
  artifacts:
    name: "pathname-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/pathname/]
    expire_in: 30 days

pathname:probe:clautolisp:linux:
  rules:
    - *not-on-schedule
    - when: on_success
  extends: .pathname-probe
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-pathname-probe.sh --backend clautolisp

.benchmark:
  stage: benchmark
  # A benchmark may not hold a runner for the project default (120 min).
  # These jobs measure a warm build and finish in about 90 seconds
  # (bricscad:windows 1m37, clautolisp:windows 1m16, bricscad:macos 1m00),
  # so 15 minutes is an order of magnitude of headroom and still turns a
  # hung CAD into a ten-minute failure instead of an unbounded one.
  # allow_failure is already true here: a benchmark is a measurement, never
  # a release product, and it must not be able to cost one.
  #
  # This cap was written (1.8.51) while `benchmark' still ran IN FRONT OF
  # `release', where a hang gated every release lane -- release-1.8.47 was
  # cancelled by hand, release-1.8.49 waited the full two hours. The stage
  # now runs after `collect' (see the stages: list), so that particular
  # damage is gone by construction. The timeout stays: it is what keeps a
  # wedged CAD from holding the concurrency-1 Windows runner against every
  # OTHER pipeline, which reordering does nothing about.
  timeout: 15 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
    BENCH_SECONDS: '3.0'
  # MANUAL: benchmarks/probes are reason-1 jobs (one-shot, on-demand); a release
  # must not depend on a benchmark having run. Covers benchmark:* and, via
  # .benchmark-cad, the CAD archival lanes.
  rules:
    - *not-on-schedule
    - when: manual
      allow_failure: true
  artifacts:
    name: "bench-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/bench/]
    expire_in: 30 days

# --- clautolisp: the standalone executable runs the pure-AutoLISP suite ---
benchmark:clautolisp:linux:
  extends: .benchmark
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  script:
    - make build-programs
    - mkdir -p dist/bench
    - make -C autolisp-benchmark run-clautolisp-sbcl 2>&1 | tee dist/bench/clautolisp-linux.txt

benchmark:clautolisp:macos:
  extends: .benchmark
  tags: [macos, arm64, shell]
  script:
    - make build-programs
    - mkdir -p dist/bench
    - make -C autolisp-benchmark run-clautolisp-sbcl 2>&1 | tee dist/bench/clautolisp-macos.txt

benchmark:clautolisp:windows:
  extends: .benchmark
  tags: [windows, amd64, shell]
  variables:
    <<: *windows-clean
  script:
    - make build-programs
    - New-Item -ItemType Directory -Force dist/bench | Out-Null
    # Merge all streams (*>&1), show them as they arrive, and keep UTF-8.
    #
    # Tee-Object -Variable, not Out-File: sending the run's output straight
    # to a file makes the job trace silent for its whole duration, so a job
    # that hangs and a job that works produce the same log -- and if it
    # never finishes, the output is never shown at all. That is what made
    # benchmark:autocad:windows undiagnosable from outside.
    # Tee-Object -FilePath would restore the live trace but writes UTF-16LE
    # under PowerShell 5.1; PowerShell's bare `*>' does the same, which the
    # Pages report parser used to read as UTF-8 garbage (empty column). It
    # sniffs the BOM now, but UTF-8 keeps the raw artifact readable, so the
    # output is captured in a variable and written explicitly.
    - make -C autolisp-benchmark run-clautolisp-sbcl *>&1 | Tee-Object -Variable benchOut
    - $benchOut | Out-File -Encoding utf8 dist/bench/clautolisp-windows.txt

# --- CAD: alfe drives the real CAD to run the same suite ---
# SHAKEDOWN PENDING: like the vendor probes, the CAD path needs a first run on
# the runner to settle (runtime-LSP env is set below; BricsCAD Windows gets the
# clean profile). Expect iteration, exactly as the probes did.
.benchmark-cad:
  extends: .benchmark
  variables:
    ALFE_RUNTIME_LSP: "$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-remote-io.lsp"
    ALFE_BOOTSTRAP_LSP: "$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-bootstrap.lsp"

benchmark:bricscad:macos:
  extends: .benchmark-cad
  tags: [macos, arm64, shell, cad]
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - mkdir -p dist/bench
    - make -C autolisp-benchmark run-bricscad-macos 2>&1 | tee dist/bench/bricscad-macos.txt

benchmark:bricscad:windows:
  extends: .benchmark-cad
  tags: [windows, amd64, shell, cad]
  variables:
    <<: *windows-clean
    AUTOLISP_BRICSCAD_PROFILE: '<<Profil sans nom>>'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - New-Item -ItemType Directory -Force dist/bench | Out-Null
    # Live trace + UTF-8 artifact -- see benchmark:clautolisp:windows.
    - make -C autolisp-benchmark run-bricscad-windows *>&1 | Tee-Object -Variable benchOut
    - $benchOut | Out-File -Encoding utf8 dist/bench/bricscad-windows.txt

benchmark:autocad:windows:
  extends: .benchmark-cad
  tags: [windows, amd64, shell, cad]
  variables:
    <<: *windows-clean
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - New-Item -ItemType Directory -Force dist/bench | Out-Null
    # Live trace + UTF-8 artifact -- see benchmark:clautolisp:windows. This
    # is the job whose silence hid a two-hour hang twice; with the tee, the
    # last line it printed before stalling is visible in the trace.
    - make -C autolisp-benchmark run-autocad-windows *>&1 | Tee-Object -Variable benchOut
    - $benchOut | Out-File -Encoding utf8 dist/bench/autocad-windows.txt

# --- publish: aggregate whatever ran into one table on GitLab Pages ---
pages:
  stage: deploy
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - { job: "benchmark:clautolisp:linux",   artifacts: true, optional: true }
    - { job: "benchmark:clautolisp:macos",   artifacts: true, optional: true }
    - { job: "benchmark:clautolisp:windows", artifacts: true, optional: true }
    - { job: "benchmark:bricscad:macos",     artifacts: true, optional: true }
    - { job: "benchmark:bricscad:windows",   artifacts: true, optional: true }
    - { job: "benchmark:autocad:windows",    artifacts: true, optional: true }
  rules:
    - *not-on-schedule
    - *on-release-mandatory
    - when: manual
      allow_failure: true
  script:
    - python3 scripts/benchmark-report.py dist/bench public
  artifacts:
    paths: [public]

# --- collect: union the per-target artefacts into the combined set -----
#
# Gathers the per-target release jobs' dist/ (binaries-<os>-<arch>,
# libraries-<os>-<arch>, sources, documentation, windows) and unions
# them into the combined clautolisp-<ver>-{binaries,libraries}.tar.bz2
# (+ sources/documentation passthrough, windows kept as-is). Exposed as
# downloadable job artifacts only — publishing a GitLab Release is a
# separate, on-demand step taken AFTER the artefacts are tested.
collect:release:
  stage: collect
  # Just unions the per-target dist/ (tar/bzip2) — no platform-specific
  # toolchain needed, so run it on the always-on poseidon box rather than
  # waiting on the intermittent macOS laptop.
  tags: [linux, amd64, docker]
  image: $CLAUTOLISP_CI_LATEST
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # GitHub handoff for the Windows set (windows-build-host.issue / !129).
    # GH_REPO/GH_WORKFLOW are plain; GH_TOKEN is a masked CI/CD variable with
    # actions:read on the repo.
    GH_REPO: "ogamita/clautolisp"
    GH_WORKFLOW: "release.yml"
  # EVERY release:* job belongs here: one omitted costs a full build whose
  # artefacts are then discarded in silence (which is what happened to
  # release:linux:arm32). `needs:' cannot be a glob, so
  # scripts/check-release-collect-needs.sh makes the omission fail the
  # pipeline instead — add a platform, and it tells you to wire it here.
  # The intermittent platforms are `optional': their job is SKIPPED on a
  # release tag when the runner is offline (see .on-release-windows /
  # .on-release-macos), and a non-optional `needs' on a skipped job would
  # fail this one -- turning "the laptop was off" into "the release
  # produced nothing at all", which is precisely the outcome pjb ruled
  # against: a release without a runner ships without that runner's
  # products.
  #
  # collect-artefacts prints which targets actually reached it, so a short
  # set is visible in the log instead of being silently smaller.
  needs:
    - { job: "release:linux:x86-64", artifacts: true }
    - { job: "release:linux:arm64",  artifacts: true }
    # arm32 is OPTIONAL, and since 1.9.0 that is the NORMAL case rather
    # than a switched-off one: the lane is off by default (it is blocked,
    # see .on-release-arm32), so it is simply ABSENT from a release
    # pipeline, and `optional' is what lets this job proceed without it.
    #
    # `optional' is NOT what makes a manual job safe to need -- that was
    # my error, and it cost two releases. GitLab SKIPS a job whose need is
    # an unplayed manual job, optional or not: optional covers ABSENT, not
    # PRESENT-BUT-UNPLAYED. release-1.8.43 published nothing that way, and
    # release-1.8.47 was skipped again until the arm32 job was played by
    # hand. Every job needed here is therefore automatic on a release tag;
    # check-release-collect-needs.sh enforces exactly that.
    - { job: "release:linux:arm32",  artifacts: true, optional: true }
    - { job: "release:darwin:arm64", artifacts: true, optional: true }
    # release:windows:x86-64 is intentionally NOT here: the release Windows set
    # is built on GitHub Actions and fetched below with `gh run download`
    # (windows-build-host.issue / !129). check-release-collect-needs.sh exempts
    # it as collected out-of-band; the GitLab job is a manual PC fallback only.
    - { job: "release:documentation", artifacts: true }
  rules:
    - *not-on-schedule
    - *on-release-mandatory
    - when: manual
      allow_failure: true
  before_script:
    # tar/make are in the CI image; install bzip2 if the image lacks it
    # (mirrors release:linux:x86-64's package-guard).
    # zip/unzip are needed for the Windows .zip artefacts and the -all.zip
    # (pjb, 2026-08-16). collect-artefacts ERRORS rather than skipping when
    # they are missing, so a release cannot quietly ship without them.
    - pkgs=""; for t in bzip2 tar make zip unzip curl; do command -v $t >/dev/null 2>&1 || pkgs="$pkgs $t"; done; [ -z "$pkgs" ] || { apt-get update && apt-get install -y $pkgs; }
    # gh reads $GH_TOKEN from the environment; install it self-contained if the
    # CI image lacks it (TODO: bake gh into the image).
    - |
      if ! command -v gh >/dev/null 2>&1; then
        GH_VER=2.62.0
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" -o /tmp/gh.tgz
        tar -xzf /tmp/gh.tgz -C /tmp
        install -m0755 "/tmp/gh_${GH_VER}_linux_amd64/bin/gh" /usr/local/bin/gh
      fi
      gh --version | head -1
  script:
    # Pull the Windows release set GitHub Actions built for this tag. Best-effort
    # (windows-build-host.issue / !129): if GitHub has not finished (mirror lag)
    # or GH_TOKEN is unset, the set still assembles WITHOUT Windows and the log
    # says so — re-run this job later to fold it in. verify-release-artefacts /
    # check-release-artefact-set flag a short set downstream.
    - |
      if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
        tag="${CI_COMMIT_TAG:-}"
        rid="$(gh run list -R "$GH_REPO" --workflow "$GH_WORKFLOW" --branch "$tag" \
                 --json databaseId,status --jq \
                 'map(select(.status=="completed"))|.[0].databaseId' 2>/dev/null || true)"
        if [ -n "$rid" ]; then
          gh run download "$rid" -R "$GH_REPO" -p 'clautolisp-*-windows-*' -D dist \
            && echo "fetched Windows set:" && find dist -name 'clautolisp-*-windows-*.zip' \
            || echo "WARN: gh run download failed; assembling WITHOUT the Windows set"
        else
          echo "WARN: no completed GitHub run for $tag yet; assembling WITHOUT the Windows set"
        fi
      else
        echo "WARN: gh unavailable or GH_TOKEN unset; assembling WITHOUT the Windows set"
      fi
    # gh nests each artifact under dist/<name>/ — flatten the win zips into dist/.
    - find dist -mindepth 2 -name 'clautolisp-*-windows-*.zip' -exec cp {} dist/ \; 2>/dev/null || true
    - make collect-artefacts COLLECT_IN=dist COLLECT_OUT=dist/combined
  artifacts:
    name: "clautolisp-$CI_COMMIT_TAG-release"
    paths: [dist/combined/]
    # NEVER, because the published release links AT these artefacts. This
    # job only runs on a release tag, and its output is the release: with
    # a 30-day expiry, every release older than a month became a catalogue
    # of dead links, which is the opposite of what publishing one is for.
    # A release is permanent, so its assets must be too.
    expire_in: never

# --- deploy: publish the spec HTML manual to the poseidon web site -----
#
# Takes release:documentation's artefact
# (dist/clautolisp-<ver>-documentation.tar.bz2), unpacks the prebuilt
# HTML manual it ships at  share/doc/autolisp-spec/html/  and rsyncs it
# over SSH onto the poseidon web root, publishing it at
#   http://poseidon.informatimago.com/ogamita/autolisp-spec/
#
# These HTML pages are BUILD OUTPUT ("object files") of the documentation
# job — they are deployed here, never committed. The poseidon web site is
# itself a git repo whose .gitignore excludes ogamita/autolisp-spec/ for
# exactly this reason.
#
# Runs on the poseidon group runner (linux,amd64,docker — a rootless
# docker executor on poseidon itself) and SSHes back to the host's sshd
# as the dedicated, least-privilege deploy account. Triggered on a version
# tag (after release:documentation succeeds) or manually.
#
# The deploy account's key is locked down with an rrsync forced command
# (command="rrsync .../ogamita/autolisp-spec",restrict in authorized_keys):
# the key can ONLY rsync into that one directory — no shell, no other path,
# no port/agent/X11 forwarding. So the remote target below is the empty
# path (rrsync chroots the session to the restricted dir) and there is no
# server-side mkdir step. See documentation/poseidon-deploy.md (the
# setup-deploy.sh helper provisions the account, dir and key).
#
# Required CI/CD variables (Settings > CI/CD > Variables — set them
# protected AND masked). Both are stored BASE64-ENCODED: a raw multi-line
# SSH key / known_hosts cannot be masked (GitLab rejects whitespace), but
# its single-line base64 can be. setup-deploy.sh prints the exact values.
# The job base64-decodes them (it works with value- or File-type vars):
#   DEPLOY_SSH_PRIVATE_KEY  base64 of the private key whose public half is
#                           the deploy account's rrsync authorized_keys entry
#   DEPLOY_KNOWN_HOSTS      base64 of `ssh-keyscan poseidon.informatimago.com`
# The non-secret host/account below are plain job variables; override in CI
# if they ever change.
deploy:documentation:
  stage: deploy
  image: $CLAUTOLISP_CI_LATEST
  tags: [linux, amd64, docker]        # poseidon (always-on); SSHes to its own sshd
  variables:
    GIT_STRATEGY: none                # nothing from the repo is needed — only the artefact
    DEPLOY_HOST: poseidon.informatimago.com
    DEPLOY_USER: clautolisp-deploy
    DEPLOY_URL: http://poseidon.informatimago.com/ogamita/autolisp-spec/
  needs:
    - { job: "release:documentation", artifacts: true }
  rules:
    - *not-on-schedule
    - *on-release-mandatory
    - when: manual
      allow_failure: true
  before_script:
    # rsync + ssh client may be absent from the CI image; install if so.
    - need=""; command -v rsync >/dev/null 2>&1 || need="$need rsync"; command -v ssh >/dev/null 2>&1 || need="$need openssh-client"; [ -z "$need" ] || { apt-get update && apt-get install -y --no-install-recommends $need; }
  script:
    - set -eu
    # 1. Unpack the documentation artefact and locate the HTML manual.
    - tarball=$(ls dist/clautolisp-*-documentation.tar.bz2 | head -n1)
    - 'echo "deploying from: $tarball"'
    - stage=$(mktemp -d)
    - tar -C "$stage" -xjf "$tarball"
    - html="$stage/share/doc/autolisp-spec/html"
    - test -f "$html/index.html"   # fail loudly if the artefact layout changed
    # 2. Prepare an isolated SSH config. The secrets are base64 (so they can
    #    be masked); decode them. Accept value- or File-type variables.
    - install -d -m 700 ~/.ssh
    - if [ -f "$DEPLOY_SSH_PRIVATE_KEY" ]; then base64 -d "$DEPLOY_SSH_PRIVATE_KEY"; else printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" | base64 -d; fi > ~/.ssh/id_deploy
    - if [ -f "$DEPLOY_KNOWN_HOSTS" ]; then base64 -d "$DEPLOY_KNOWN_HOSTS"; else printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d; fi > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
    - 'SSH="ssh -i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes"'
    # 3. Mirror the manual into the rrsync-restricted dir (empty remote path
    #    = the restricted root). --delete prunes pages dropped from a newer
    #    spec build; the dir is pre-provisioned by setup-deploy.sh.
    - rsync -rlptz --delete -e "$SSH" "$html/" "$DEPLOY_USER@$DEPLOY_HOST:"
    - 'echo "published to $DEPLOY_URL"'
  environment:
    name: poseidon/autolisp-spec
    url: http://poseidon.informatimago.com/ogamita/autolisp-spec/
