verify:bricscad-hidden-ui:windows:
  extends: .gate-windows-cad-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bricscad-hidden-ui.ps1

# MANUAL-ONLY (not auto-gated): --mode automation on macOS is not yet
# validated — BricsCAD launches but the osascript/AppleScript path does not
# drive it (it sits interactive), so an auto-run would just hang the serial
# macOS runner. Kept clickable, but EXPECT IT TO FAIL, and not because
# anything regressed: the alfe-bricscad-automation-macos decision was
# taken in 1.8.34 (pjb chose option A), and `--mode automation' is now
# WINDOWS-ONLY -- alfe refuses it on macOS with [NO-AUTOMATION], which is
# exactly what this job then reports.
#
# It survives as the investigation tool for option B (driving the
# launcher by hand in front of the machine), which the issue left open.
# Manual-only, so it costs nothing until someone clicks it; a red run
# here is the designed refusal, not a fault to chase.
verify:bricscad-automation:macos:
  extends: .gate-macos-cad-manual
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    name: "bricscad-automation-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/bricscad-automation/]
    expire_in: 30 days
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/verify-bricscad-automation.sh

