vendor:probes:autocad:
  extends: [.gate-windows-cad-hard, .vendor-probe-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_KEEP_WORKDIR: '1'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-vendor-probes.ps1 -Backend autocad -KeepWorkdir $env:PROBE_KEEP_WORKDIR

# The probes/ SUITE (probes/sources/manifest.txt), as opposed to the alfe
# scenario probes above. It had no CI job at all: `make probe-autocad' was
# a manual ritual on someone's machine, which is why questions it answers
# stayed open.
#
# SOFT on purpose, on a tag as everywhere else: a probe MEASURES an engine,
# it does not gate a release. Its answer changes what clautolisp claims,
# and that is a decision, not a build failure.
#
# PROBE_NO_COMMIT: the runner script normally git-commits its results so
# they can be handed back; in CI the checkout is detached and committing
# there would be pointless, so the results travel as an artefact instead.
probe:suite:autocad:windows:
  extends: .gate-windows-cad-soft
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_NO_COMMIT: '1'
  script:
    - make -C clautolisp build-clautolisp-sbcl
    - make probe-autocad
  artifacts:
    when: always
    name: "probe-suite-autocad-$CI_COMMIT_SHORT_SHA"
    paths: [probe-results/]
    expire_in: 90 days

# BricsCAD's half of the probes/ suite, on BOTH platforms because BricsCAD
# runs on both and a divergence between them is itself an answer.
#
# There was no BricsCAD job for this suite at all -- only the AutoCAD one
# above -- so any probe/ question needing BOTH engines could not be
# answered from CI. foreach-binding-vs-assignment.issue is exactly such a
# question, which is what these jobs are for.
#
# SOFT, like the AutoCAD one and for the same reason: a probe MEASURES an
# engine, it does not gate anything. PROBE_NO_COMMIT because the CI
# checkout is detached; results travel as an artefact.
#
# PROBE_SUITES is set because the FULL suite does not survive BricsCAD:
# on both platforms it writes `wrapper-start' and then the engine dies
# (segfault on macOS, silent exit on Windows) before a single record --
# see issues/open/probes-suite-crashes-bricscad.issue. Narrowing to the
# suite whose question is actually open gets that answer today instead of
# waiting for the rest to be diagnosed. Widen it as suites are cleared.
#
# The value is a PAIR, and deliberately: narrowing to foreach-scope alone
# still segfaulted, which leaves three candidates -- probe-core's load,
# the new suite's load, and CAD-PROBE-BEGIN-RUN -- and does not separate
# them. `rtos foreach-scope' does: rtos is an ORIGINAL suite and runs
# first, so run-start plus rtos records and no foreach records means the
# new suite is at fault, while nothing beyond wrapper-start again means
# the fault is in probe-core or begin-run and the new suite is
# exonerated. The experiment is the job.
probe:suite:bricscad:macos:
  extends: .gate-macos-cad-soft
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_NO_COMMIT: '1'
    PROBE_SUITES: 'rtos foreach-scope'
  script:
    # alfe as well as clautolisp: the BricsCAD probes are DRIVEN BY ALFE
    # (detect-cad.sh), because launching BricsCAD directly segfaults on
    # both platforms while alfe drives it green on both.
    - make -C clautolisp build-clautolisp-sbcl
    - make -C autolisp-front-end build-alfe-sbcl
    - make probe-bricscad
  artifacts:
    when: always
    name: "probe-suite-bricscad-macos-$CI_COMMIT_SHORT_SHA"
    paths: [probe-results/]
    expire_in: 90 days

probe:suite:bricscad:windows:
  extends: .gate-windows-cad-soft
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_NO_COMMIT: '1'
    PROBE_SUITES: 'rtos foreach-scope'
  script:
    - make -C clautolisp build-clautolisp-sbcl
    - make -C autolisp-front-end build-alfe-sbcl
    - make probe-bricscad
  artifacts:
    when: always
    name: "probe-suite-bricscad-windows-$CI_COMMIT_SHORT_SHA"
    paths: [probe-results/]
    expire_in: 90 days

vendor:probes:bricscad:macos:
  extends: [.gate-macos-cad-hard, .vendor-probe-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_KEEP_WORKDIR: '1'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-vendor-probes.sh --backend bricscad --keep-workdir "$PROBE_KEEP_WORKDIR"

# --- clean-profile sysvar harvest for BricsCAD Phase 2 ---------------------
# NON-GATING data collection (allow_failure via the soft gate). Drives
# `make save-sysvars` restricted to the bricscad backend/dialect against
# real BricsCAD via a built-not-installed alfe, from a PRISTINE profile and
# a freshly-created default drawing, so sysvars-alfe-<uname>-bricscad.txt is
# a *clean factory-default* reference — unlike the customised / French /
# metric dump the issue's "IMPORTANT caveat" warns against bulk-importing.
#
# Feed the artifacts to scripts/classify-sysvar-diff.py and paste bucket
# (b) into *BRICSCAD-FACTORY-DEFAULTS* (cador/source/bricscad-sysvar-
# overrides.lisp). Full steps: "Phase 2 runbook" in
# issues/open/bricscad-dialect-sysvar-parity.issue.
#
# pjb must provision on the bricscad runner:
#   BRICSCAD_PROFILE_CLEAN  — name of a pristine BricsCAD profile (no
#                             vertical app / custom paths / non-default
#                             locale). Exported here to alfe as
#                             AUTOLISP_BRICSCAD_PROFILE, the same clean-
#                             profile knob the vendor-probe scripts use.
# The drawing must be a freshly-created default (metric/imperial per the
# template decision) — do NOT open a saved customised .dwg.
.sysvars-artifacts:
  interruptible: true
  artifacts:
    name: "sysvars-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - sysvars-alfe-*-bricscad.txt
      - sysvars-clautolisp-*-bricscad.txt
    expire_in: 30 days

harvest:sysvars:bricscad:macos:
  extends: [.gate-macos-cad-soft, .sysvars-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    ALFE_BIN: '$CI_PROJECT_DIR/autolisp-front-end/tools/alfe/bin/alfe-sbcl'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    # CAD-side runtime for a built-not-installed alfe (see the probe scripts).
    - export ALFE_RUNTIME_LSP="$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-remote-io.lsp"
    - export ALFE_BOOTSTRAP_LSP="$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-bootstrap.lsp"
    # Clean profile: name a pristine BricsCAD profile so no vertical app or
    # custom path/locale contaminates the factory-default reference.
    - export AUTOLISP_BRICSCAD_PROFILE="${BRICSCAD_PROFILE_CLEAN:-<<Profil sans nom>>}"
    - make save-sysvars ALFE="$ALFE_BIN" SAVE_SYSVARS_BACKENDS=bricscad SAVE_SYSVARS_DIALECTS=bricscad

# Windows twin. Provided for parity with the sibling bricscad windows jobs
# (pathname:probe / encoding:experiment). NOTE: `make save-sysvars` uses a
# POSIX `for` recipe, so it depends on the runner's GNU make having a sh
# (as `make build-alfe-sbcl` already does on this runner). Non-gating; the
# authoritative reference is the Darwin dump, so a Windows shell mismatch
# here is not release-blocking. pjb must confirm this runs before relying
# on the Windows artifact.
harvest:sysvars:bricscad:windows:
  extends: [.gate-windows-cad-soft, .sysvars-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # .exe, unlike the macOS twin below: since
    # alfe-sbcl-windows-build-missing-exe-suffix the Windows build produces
    # alfe-sbcl.exe, and an extension-less name is not executable on
    # Windows at all -- `cannot execute binary file: Exec format error',
    # which is how both Windows benchmarks died on the release-1.9.0 tag.
    # This job hands ALFE_BIN straight to make, so nothing downstream
    # repairs the name for it, unlike the run-*.ps1 probes which copy to
    # .exe themselves (windows-exe-suffix-callers-not-swept.issue).
    ALFE_BIN: '$CI_PROJECT_DIR/autolisp-front-end/tools/alfe/bin/alfe-sbcl.exe'
    # These were `export' lines copied from the macOS twin below. `export' is
    # a POSIX builtin and this job's shell is PowerShell, where it is not a
    # command at all: the job died with CommandNotFoundException on the first
    # one, having never launched BricsCAD. `variables:' is shell-agnostic,
    # which is the property this job needed all along.
    ALFE_RUNTIME_LSP: '$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-remote-io.lsp'
    ALFE_BOOTSTRAP_LSP: '$CI_PROJECT_DIR/autolisp-front-end/source/runtime/autolisp-bootstrap.lsp'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    # Clean profile, honouring $BRICSCAD_PROFILE_CLEAN. Not a `variables:'
    # entry because the default must not shadow a project-level override, and
    # `${VAR:-default}' is a shell expansion PowerShell does not have either.
    - 'if ($env:BRICSCAD_PROFILE_CLEAN) { $env:AUTOLISP_BRICSCAD_PROFILE = $env:BRICSCAD_PROFILE_CLEAN } else { $env:AUTOLISP_BRICSCAD_PROFILE = "<<Profil sans nom>>" }'
    # $env:NAME, not $NAME: in PowerShell the bare form is a script variable
    # that does not exist here, so the make invocation was passing ALFE="".
    - 'make save-sysvars ALFE="$env:ALFE_BIN" SAVE_SYSVARS_BACKENDS=bricscad SAVE_SYSVARS_DIALECTS=bricscad'

# --- native "does alfe build on this OS" check (no CAD) ---------------------
# Gated like the other native jobs: auto when the runner is online. Not a CAD
# job, so plain [os, arch, shell] tags (may run on the higher-concurrency
# runner). The binary is published as an artifact for download.
build:alfe:macos:
  extends: .gate-macos-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
  artifacts:
    name: "alfe-$CI_COMMIT_SHORT_SHA"
    paths: [autolisp-front-end/tools/alfe/bin/]
    expire_in: 1 day

# NO artifacts, deliberately. This job's value is proving that alfe BUILDS
# on Windows, which the build itself establishes; the binary it produced was
# uploaded for nobody. Verified before removing: no job `needs' it, nothing
# downloads it, and the CAD jobs on the same runner rebuild alfe themselves.
#
# It was not merely waste. On a release tag this job is allow_failure: false
# (.gate-windows-hard), and on release-1.8.42 the ~13 MB upload died three
# times mid-POST -- "use of closed network connection" -- so a release was
# blocked by an artefact with no consumer. Every Windows job that uploads
# 0.0-0.5 MB succeeds on that machine while this one does not, which points
# at a middlebox (firewall/DPI/antivirus) cutting long transfers rather than
# at anything CI can fix. The right answer is not to make the upload more
# robust: it is not to make it.
build:alfe:windows:
  extends: .gate-windows-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    # PowerShell does NOT fail a step on a native program's non-zero exit
    # (see release:windows:x86-64 in .gitlab-ci.yml for the same lesson) --
    # without this check a broken build would sail straight into the
    # --version probe below and surface as a confusing "not recognized"
    # error instead of the real build failure.
    - 'if ($LASTEXITCODE -ne 0) { throw "build-alfe-sbcl failed ($LASTEXITCODE)" }'
    # Sanity check, kept permanently (mirrors `Get-ChildItem dist` in
    # release:windows:x86-64): shows what build-alfe-sbcl actually produced
    # before the --version probe below trusts a specific filename. This is
    # what caught alfe-sbcl-windows-build-missing-exe-suffix.issue -- SBCL's
    # SAVE-LISP-AND-DIE :EXECUTABLE T was silently writing a plain,
    # extension-less `alfe-sbcl' image on this runner, so every downstream
    # reference to `alfe-sbcl.exe' failed with a bare "file not found",
    # nothing pointing at the real cause. Fixed at the source in
    # clautolisp/autolisp-reader/tools/read-autolisp/generate.lisp
    # (EXECUTABLE-PROGRAM-NAME), which now appends .exe itself on Windows
    # rather than trusting the implementation to do it.
    - 'Get-ChildItem "$env:CI_PROJECT_DIR\autolisp-front-end\tools\alfe\bin" -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host'
    # Prove the binary exists and answers, since no artefact records it.
    #
    # An ABSOLUTE path is required, via $env:CI_PROJECT_DIR. PowerShell only
    # auto-executes a path when it is QUALIFIED -- absolute, a drive letter,
    # or explicitly relative (.\, ..\) -- or found on PATH; a bare
    # "dir/exe.exe" is parsed as a command NAME rather than a path and gives
    # CommandNotFoundException even when the file exists (job 16000852460).
    # The `&' call operator alone does NOT fix this: `&' only forces
    # PowerShell to invoke its argument as a command, it does not change how
    # that argument is resolved, so `& "dir/exe.exe"' hits the exact same
    # CommandNotFoundException (confirmed on MR !111).
    - '& "$env:CI_PROJECT_DIR\autolisp-front-end\tools\alfe\bin\alfe-sbcl.exe" --version'
    - 'if ($LASTEXITCODE -ne 0) { throw "alfe-sbcl.exe --version failed ($LASTEXITCODE)" }'
