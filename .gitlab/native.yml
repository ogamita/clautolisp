# --- pathname "." / ".." probe (self-contained) ----------------------------
# --- path-carrying system variables: what a real engine actually holds ------
#
# bricscad-sysvars-on-macos.issue. The inventory marks most of these
# :host-specific, so the generated catalogue carries "" -- which means NOBODY
# MEASURED THEM, not that a real CAD leaves them empty. Every proposal about
# what clautolisp should put in them is a guess until these have run.
#
# FOUR jobs for THREE engines, and the fourth is the point: AutoCAD is probed
# twice, once through the GUI engine (--mode automation -> acad) and once
# headless (--mode batch -> AcCoreConsole). Whether the two populate the same
# variables is one of the questions being asked (pjb) -- a variable only the
# GUI fills is one clautolisp has no reason to imitate, and finding that out
# by reading documentation is exactly what this avoids.
.path-sysvars-artifacts:
  artifacts:
    name: "path-sysvars-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/path-sysvars/]
    expire_in: 30 days

