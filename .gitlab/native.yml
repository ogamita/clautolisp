# Child pipeline: native (macOS / Windows) intermittent-runner jobs, gated on
# runner availability (runner-availability-gating.issue).
#
# Triggered by the parent's `native:pipeline`, which passes MACOS_RUNNER /
# WINDOWS_RUNNER (online|offline) from detect:runners. Here they are ordinary
# variables, KNOWN at this pipeline's creation, so the gate rules: below pick
#   online  -> when: on_success  (the job runs automatically)
#   offline -> when: manual      (fallback: clickable, non-blocking, never
#                                 stuck-pending, never reddens the pipeline)
# and a release-* TAG keeps the jobs that used to be release-mandatory
# mandatory (block the release).
#
# Child pipelines do NOT inherit the parent's anchors / templates, so the gate
# templates are defined here. Native jobs run on shell executors, no image.
#
# STILL IN THE PARENT (.gitlab-ci.yml), not here:
#   - release:* (must not auto-run per push; mandatory only on release tags),
#     benchmark:* (expensive, manual);
#   - build:alfe:{macos,windows} + vendor:probes:* — build:alfe is a `needs:`
#     dependency of the parent's benchmark:*:cad jobs, so it can't move alone;
#     vendor:probes migrate in a follow-up (made self-building so they no
#     longer need build:alfe);
#   - the *:linux encoding / pathname probes (Linux runner is always-on).

stages:
  - test

# EVERY job here is interruptible, so a superseded child pipeline can be
# auto-cancelled instead of living for ever
# (ci-native-child-pipeline-creation-fails.issue).
#
# The jobs of this child are `manual' whenever their runner is offline, so
# the child NEVER completes on its own: it stays ACTIVE, and its jobs keep
# counting against the project's jobs-in-active-pipelines cap. One immortal
# pipeline per push. On 2026-08-19 that cap was reached -- 17 children still
# `running', the oldest seven hours old -- and NO new child could be created,
# which made every pipeline red with zero failed jobs.
#
# GitLab only auto-cancels a superseded pipeline when its pending/running
# jobs are ALL interruptible; a single job without it pins the pipeline.
# Three jobs below already declared it individually, which is exactly the
# half-measure that does nothing: the other twenty-three held the pipeline
# open. Declared here so it applies to every job, including the ones added
# next.
#
# On a release tag this changes nothing in practice: auto-cancel only fires
# when a NEWER pipeline supersedes one on the same ref, and a release tag is
# not re-pushed.
default:
  interruptible: true

# --- gate templates --------------------------------------------------------
# *-hard : jobs that were release-mandatory (test:*, verify:*) -> on a
#          release tag they are on_success and BLOCK the release
#          (allow_failure:false), as before.
# *-soft : jobs that were never release-blocking (conformance:*, encoding:*,
#          pathname:*) -> allow_failure everywhere.
# A RELEASE IS NEVER HOSTAGE TO AN ABSENT MACHINE (pjb, 2026-08-16):
# "si on lance une release sans un runner, ca passe sans ses produits. Mais
# si le runner est disponible ses produits doivent etre inclus".
#
# So on a release tag the platform gate is decided by RUNNER AVAILABILITY,
# which detect:runners publishes as MACOS_RUNNER / WINDOWS_RUNNER:
#
#   tag + runner online  -> runs, and BLOCKS the release if it fails. The
#                           machine is there, so its products belong in the
#                           release and a failure is a real failure.
#   tag + runner offline -> does not run at all. The release ships without
#                           that platform's products rather than waiting on
#                           a laptop that is switched off.
#
# The order matters: the online case must be tested FIRST, because GitLab
# takes the first matching rule. The previous shape had the bare tag rule
# first, which made every release mandatory-on-Windows whatever the runner
# was doing -- that is how release-1.8.42 came to be blocked by a machine
# whose network was failing.
#
# detect:runners is fail-safe (any API error yields `offline'), so the
# failure mode is a release missing a platform's artefacts, never a release
# blocked on a machine nobody can reach.
.gate-macos-hard:
  tags: [macos, arm64, shell]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/ && $MACOS_RUNNER == "online"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
      when: never
    - if: '$MACOS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

# Windows shell-runner hygiene, repeated here because A CHILD PIPELINE
# DOES NOT INHERIT THE PARENT'S ANCHORS. The same variable is set on the
# parent's Windows jobs (.windows-clean in .gitlab-ci.yml); applying it
# there only was an incomplete fix, and it showed: on MR!99 the child's
# probe:suite:autocad:windows, vendor:probes:* and pathname:probe:* all
# died in get_sources on
#
#   failed to remove dist/vendor-probes/autocad/drawing-data.log:
#   Device or resource busy
#
# -- a CAD process outliving its job and holding a file open, which the
# runner's default `git clean -ffdx' cannot delete on Windows (POSIX can
# unlink an open file; Windows cannot). The job then dies before its own
# script runs.
#
# Put on the GATE TEMPLATES rather than per job, so every Windows job in
# this file is covered, including ones added later. `extends' deep-merges
# variables, so a job with its own variables: block keeps both.
.windows-clean-vars: &windows-clean-vars
  GIT_CLEAN_FLAGS: -ffd

.gate-windows-hard:
  tags: [windows, amd64, shell]
  variables:
    <<: *windows-clean-vars
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/ && $WINDOWS_RUNNER == "online"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
      when: never
    - if: '$WINDOWS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

.gate-macos-soft:
  tags: [macos, arm64, shell]
  rules:
    - if: '$MACOS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

.gate-windows-soft:
  tags: [windows, amd64, shell]
  variables:
    <<: *windows-clean-vars
  rules:
    - if: '$WINDOWS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

# manual-only: NEVER auto-start, even when the runner is online. For a job
# that is known not to work headlessly and would otherwise hang the runner.
.gate-macos-manual:
  tags: [macos, arm64, shell]
  rules:
    - when: manual
      allow_failure: true

# CAD-capability variants: jobs that LAUNCH a real BricsCAD/AutoCAD add the
# `cad' tag, routing them to the CAD-capable runner, which pjb configures
# concurrency=1. Same rules as the base gate; only the tag list differs.
# Non-CAD native jobs keep the plain [os, arch, shell] tags and may run on a
# higher-concurrency runner.
#
# ONE tag, not one per vendor (pjb, 2026-08-14). The mutex a CAD job needs is
# GLOBAL, not per-vendor: two BricsCAD must not run at once, two AutoCAD must
# not, and a BricsCAD must not run beside an AutoCAD either. A single `cad'
# tag on a concurrency=1 runner is what serialises all of them. Per-vendor
# tags would have created two pools that can each run one job — i.e. two CADs
# at once, the case this is meant to prevent.
#
# So there is no `bricscad' / `autocad' distinction to make here, and the
# templates are named for the capability rather than the vendor: a job's
# vendor is visible in its own name, and two identical templates under two
# names would only invite someone to believe they route differently.
#
# A CAD job gets an explicit TIMEOUT, which the non-CAD jobs do not need.
#
# On 2026-08-14 a verify:bricscad-hidden-ui:windows launched BricsCAD with
# neither a drawing nor a profile; BricsCAD put up a modal dialog asking what
# to use, invisible under /Automation, and waited. alfe's own 180 s READY
# timeout fired, but the CAD process it had spawned stayed alive, so the JOB
# did not end: it was still running 32 minutes later, holding the single
# concurrency=1 CAD slot. Every other CAD job queued behind it — 70 of them
# by the time it was noticed — and an hour of a laptop's battery went to
# nothing. Without this, the ceiling is the project default (an hour).
#
# 30m is measured, not guessed: the longest legitimate CAD job observed is
# encoding:experiment:bricscad:windows at 1158 s (19 min); everything else
# runs in under 223 s. That leaves ~55% headroom over the real outlier while
# halving the worst case. Raise it if a legitimate job ever approaches it —
# but raise it deliberately, because the cost of this ceiling being too high
# is paid by every other job on the runner.
.gate-macos-cad-hard:   { extends: .gate-macos-hard,   tags: [macos, arm64, shell, cad], timeout: 30m }
.gate-macos-cad-soft:   { extends: .gate-macos-soft,   tags: [macos, arm64, shell, cad], timeout: 30m }
.gate-macos-cad-manual: { extends: .gate-macos-manual, tags: [macos, arm64, shell, cad], timeout: 30m }
.gate-windows-cad-hard: { extends: .gate-windows-hard, tags: [windows, amd64, shell, cad], timeout: 30m }
.gate-windows-cad-soft: { extends: .gate-windows-soft, tags: [windows, amd64, shell, cad], timeout: 30m }

