# Child pipeline: native (macOS / Windows) intermittent-runner jobs, gated on
# runner availability (runner-availability-gating.issue).
#
# Triggered by the parent's `native:pipeline`, which passes MACOS_RUNNER /
# WINDOWS_RUNNER (online|offline) from detect:runners. Here they are ordinary
# variables, KNOWN at this pipeline's creation, so the gate rules: below pick
#   online  -> when: on_success  (the job runs automatically)
#   offline -> when: manual      (fallback: clickable, non-blocking, never
#                                 stuck-pending, never reddens the pipeline)
# and a release-* TAG keeps the jobs that used to be release-mandatory
# mandatory (block the release).
#
# Child pipelines do NOT inherit the parent's anchors / templates, so the gate
# templates are defined here. Native jobs run on shell executors, no image.
#
# STILL IN THE PARENT (.gitlab-ci.yml), not here:
#   - release:* (must not auto-run per push; mandatory only on release tags),
#     benchmark:* (expensive, manual);
#   - build:alfe:{macos,windows} + vendor:probes:* — build:alfe is a `needs:`
#     dependency of the parent's benchmark:*:cad jobs, so it can't move alone;
#     vendor:probes migrate in a follow-up (made self-building so they no
#     longer need build:alfe);
#   - the *:linux encoding / pathname probes (Linux runner is always-on).

stages:
  - test

# --- gate templates --------------------------------------------------------
# *-hard : jobs that were release-mandatory (test:*, verify:*) -> on a
#          release tag they are on_success and BLOCK the release
#          (allow_failure:false), as before.
# *-soft : jobs that were never release-blocking (conformance:*, encoding:*,
#          pathname:*) -> allow_failure everywhere.
.gate-macos-hard:
  tags: [macos, arm64, shell]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
      when: on_success
      allow_failure: false
    - if: '$MACOS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

.gate-windows-hard:
  tags: [windows, amd64, shell]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-[0-9]/'
      when: on_success
      allow_failure: false
    - if: '$WINDOWS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

.gate-macos-soft:
  tags: [macos, arm64, shell]
  rules:
    - if: '$MACOS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

.gate-windows-soft:
  tags: [windows, amd64, shell]
  rules:
    - if: '$WINDOWS_RUNNER == "online"'
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true

# manual-only: NEVER auto-start, even when the runner is online. For a job
# that is known not to work headlessly and would otherwise hang the runner.
.gate-macos-manual:
  tags: [macos, arm64, shell]
  rules:
    - when: manual
      allow_failure: true

# CAD-capability variants: jobs that LAUNCH a real BricsCAD/AutoCAD add the
# vendor tag, routing them to the CAD-capable runner (which pjb configures
# concurrency=1 — a GUI CAD can't run concurrently). Same rules as the base
# gate; only the tag list differs. Non-CAD native jobs keep the plain
# [os, arch, shell] tags and may run on a higher-concurrency runner.
.gate-macos-bricscad-hard:   { extends: .gate-macos-hard,   tags: [macos, arm64, shell, bricscad] }
.gate-macos-bricscad-soft:   { extends: .gate-macos-soft,   tags: [macos, arm64, shell, bricscad] }
.gate-macos-bricscad-manual: { extends: .gate-macos-manual, tags: [macos, arm64, shell, bricscad] }
.gate-windows-bricscad-hard: { extends: .gate-windows-hard, tags: [windows, amd64, shell, bricscad] }
.gate-windows-bricscad-soft: { extends: .gate-windows-soft, tags: [windows, amd64, shell, bricscad] }
.gate-windows-autocad-hard:  { extends: .gate-windows-hard, tags: [windows, amd64, shell, autocad] }
.gate-windows-autocad-soft:  { extends: .gate-windows-soft, tags: [windows, amd64, shell, autocad] }

# --- unit suites on the real OS --------------------------------------------
test:clautolisp:macos:
  extends: .gate-macos-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C clautolisp test-sbcl
    - sbcl --noinform --no-userinit --non-interactive --load "$CI_PROJECT_DIR/scripts/verify-vl-registry.lisp"

test:clautolisp:windows:
  extends: .gate-windows-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C clautolisp test-sbcl
    - sbcl --noinform --no-userinit --non-interactive --load "$env:CI_PROJECT_DIR/scripts/verify-vl-registry.lisp"

test:autolisp-test:macos:
  extends: .gate-macos-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-test test

test:autolisp-test:windows:
  extends: .gate-windows-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-test test

test:alfe:macos:
  extends: .gate-macos-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end test-sbcl

test:alfe:windows:
  extends: .gate-windows-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end test-sbcl

# --- W4 pathname-mapping conformance (real frames) -------------------------
conformance:pathname-mapping:macos:
  extends: .gate-macos-soft
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CLAUTOLISP_DEBUG_PATHMAP: "1"
  script:
    - sbcl --noinform --no-userinit --non-interactive --load "$CI_PROJECT_DIR/scripts/verify-pathname-mapping.lisp"

conformance:pathname-mapping:windows:
  extends: .gate-windows-soft
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CLAUTOLISP_DEBUG_PATHMAP: "1"
  script:
    - sbcl --noinform --no-userinit --non-interactive --load "$env:CI_PROJECT_DIR/scripts/verify-pathname-mapping.lisp"

# --- platform vl-registry verification -------------------------------------
verify:vl-registry:macos:
  extends: .gate-macos-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - sbcl --noinform --no-userinit --non-interactive --load "$CI_PROJECT_DIR/scripts/verify-vl-registry.lisp"

verify:vl-registry:windows:
  extends: .gate-windows-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - sbcl --noinform --no-userinit --non-interactive --load "$env:CI_PROJECT_DIR/scripts/verify-vl-registry.lisp"

# --- real-CAD BricsCAD automation checks (self-building) -------------------
verify:bricscad-hidden-ui:windows:
  extends: .gate-windows-bricscad-hard
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bricscad-hidden-ui.ps1

# MANUAL-ONLY (not auto-gated): --mode automation on macOS is not yet
# validated — BricsCAD launches but the osascript/AppleScript path does not
# drive it (it sits interactive), so an auto-run would just hang the serial
# macOS runner. Kept clickable, pending the alfe-bricscad-automation-macos
# decision (batch works; automation is the open question).
verify:bricscad-automation:macos:
  extends: .gate-macos-bricscad-manual
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    name: "bricscad-automation-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/bricscad-automation/]
    expire_in: 30 days
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/verify-bricscad-automation.sh

# --- encoding experiment (self-contained, builds alfe in-script) -----------
.encoding-artifacts:
  interruptible: true
  artifacts:
    name: "encoding-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/encoding/]
    expire_in: 30 days

encoding:experiment:bricscad:macos:
  extends: [.gate-macos-bricscad-soft, .encoding-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-encoding-experiment.sh --backend bricscad

encoding:experiment:bricscad:windows:
  extends: [.gate-windows-bricscad-soft, .encoding-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-encoding-experiment.ps1 -Backend bricscad

encoding:experiment:autocad:windows:
  extends: [.gate-windows-autocad-soft, .encoding-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_DWG: 'c:/gitlab-runner/dwg/empty.dwg'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-encoding-experiment.ps1 -Backend autocad -Dwg $env:PROBE_DWG

# --- pathname "." / ".." probe (self-contained) ----------------------------
.pathname-artifacts:
  interruptible: true
  artifacts:
    name: "pathname-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/pathname/]
    expire_in: 30 days

pathname:probe:bricscad:macos:
  extends: [.gate-macos-bricscad-soft, .pathname-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-pathname-probe.sh --backend bricscad

pathname:probe:bricscad:windows:
  extends: [.gate-windows-bricscad-soft, .pathname-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-pathname-probe.ps1 -Backend bricscad

pathname:probe:autocad:windows:
  extends: [.gate-windows-autocad-soft, .pathname-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_DWG: 'c:/gitlab-runner/dwg/empty.dwg'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-pathname-probe.ps1 -Backend autocad -Dwg $env:PROBE_DWG

# --- vendor probes on real BricsCAD / AutoCAD ------------------------------
# Self-building (make build-alfe-sbcl in-script), like the encoding/pathname
# probes, so they no longer `needs:` build:alfe:* (which stays in the parent
# for benchmark:*:cad). Release-mandatory when a release tag runs (.gate-hard).
.vendor-probe-artifacts:
  artifacts:
    name: "vendor-probes-$CI_COMMIT_SHORT_SHA"
    when: always
    paths: [dist/vendor-probes/]
    expire_in: 30 days

vendor:probes:bricscad:
  extends: [.gate-windows-bricscad-hard, .vendor-probe-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_DWG: 'c:/gitlab-runner/dwg/empty.dwg'
    PROBE_KEEP_WORKDIR: '1'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-vendor-probes.ps1 -Backend bricscad -Dwg $env:PROBE_DWG -KeepWorkdir $env:PROBE_KEEP_WORKDIR

vendor:probes:autocad:
  extends: [.gate-windows-autocad-hard, .vendor-probe-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_DWG: 'c:/gitlab-runner/dwg/empty.dwg'
    PROBE_KEEP_WORKDIR: '1'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-vendor-probes.ps1 -Backend autocad -Dwg $env:PROBE_DWG -KeepWorkdir $env:PROBE_KEEP_WORKDIR

vendor:probes:bricscad:macos:
  extends: [.gate-macos-bricscad-hard, .vendor-probe-artifacts]
  stage: test
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PROBE_KEEP_WORKDIR: '1'
  script:
    - make -C autolisp-front-end build-alfe-sbcl
    - bash scripts/run-vendor-probes.sh --backend bricscad --keep-workdir "$PROBE_KEEP_WORKDIR"
